# amathin_1115_1545 + clause_hw 1.0: during training the tokens of each position clause sit at their
# 3×3 cell's centre on RoPE's h / w axes (docs/moss/proposal/cdpe_text_grounding.md). Same cache,
# recipe and seed. Controls: amathin_1115_1545 and its retrain amathinr_1116_1239.
cache = "post_image_dataset/moss/ama_mitsuki_thin_tags_sure"
output = "output/ckpt_moss/amahw_1116_1239.safetensors"
clause_hw = 1.0
model = "base"
epochs = 8
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 5e-5
warmup_ratio = 0.05
plain_caption_rate = 0.0
caption_variant_rate = 0.75
ema_window = 0.1
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "off"
