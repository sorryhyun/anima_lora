# casbox_1115_1226 + clause_hw 0.25: during training the tokens of each position clause sit at their
# 3×3 cell's centre on RoPE's h / w axes, a quarter of that (a bounded offset, ~5 cells at 1024 px); generation runs
# without it (SpaG-DiT's CDPE, training-only; docs/moss/proposal/cdpe_text_grounding.md). Same cache,
# recipe and seed. Control: casbox_1115_1226.
cache = "post_image_dataset/moss/casbox_tags_sure"
output = "output/ckpt_moss/cashwq_1116_1110.safetensors"
clause_hw = 0.25
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true
