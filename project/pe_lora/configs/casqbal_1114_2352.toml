# casorderq_1114_2315 with the balanced hybrid95 self-distill of hybal95_1114_2117: on steps with
# sigma >= 0.95 the flow target is replaced by Base's velocity (image + caption through the TE's
# vision tower, teacher tail off), its MSE at the replaced FM step's gradient norm. Same cache
# (USERGUIDE tag order + 'best quality, highres' on every caption), seed and sigma/noise sequence.
# Controls: casorderq_1114_2315 (FM), castag_1114_2315 (Anima order, FM).
cache = "post_image_dataset/moss/casorderq_tags_sure"
output = "output/ckpt_moss/casqbal_1114_2352.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "base"
distill_sigma_min = 0.95
distill_add = 0.0
distill_balance = true
