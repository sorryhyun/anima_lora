# casbox_1115_1226 + self-distillation, the balanced hybrid95 recipe (configs/moss/selfdistill.toml):
# same captions (mask_dilate 16 + OCR boxes, tags), cache and latents; teacher = Base with the training
# image in the TE (casbox_tags_sure/*.moss_vis.safetensors, scripts/moss/distill_cache.py). Control: casbox_1115_1226.
cache = "post_image_dataset/moss/casbox_tags_sure"
output = "output/ckpt_moss/casboxsd_1115_1230.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "base"
distill_sigma_min = 0.95
distill_add = 0.0
distill_balance = true
