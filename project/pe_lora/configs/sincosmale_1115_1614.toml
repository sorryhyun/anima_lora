# sincos on the caststation caption line (casbox_1115_1226) with men bound: MOSS-format captions from
# scripts/moss/captions.py (thin bag, mask_dilate 16, implied cut, variants 4 / dropout 0.1, bind_males:
# a `1boy` without `pov` is a subject found by SAM3 `man`; anime_tools 0.11.0) into
# post_image_dataset/moss_captions/sincos_males (112 / 354 with clauses, 31 without men), cached
# caption_format tags with text_boxes, caption_variants on and the `sure` tail (latents hardlinked
# from sincos_tags_var). Self-distill at the 11-15 default (configs/moss/selfdistill.toml: Base teacher,
# sigma >= 0.95, distill_add 1 + distill_gate; teacher embeds from scripts/moss/distill_cache.py on this
# cache), caption variants 0.75. Recipe otherwise =
# sincostagfm_1113_0912 (swap 28 / budget 0.4, 354 images x 8 epochs = 2,832 steps, lr 5e-5).
# Controls: sincostag_1113_0717 (Anima tags, add90 ema97 distill), sincostagfm_1113_0912 (same, flow only).
cache = "post_image_dataset/moss/sincos_males_tags_sure"
output = "output/ckpt_moss/sincosmale_1115_1614.safetensors"
model = "base"
epochs = 8
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 5e-5
warmup_ratio = 0.05
plain_caption_rate = 0.0
caption_variant_rate = 0.75
ema_window = 0.1
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 28
activation_memory_budget = 0.4
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "base"
distill_sigma_min = 0.95
distill_add = 1.0
distill_gate = true
distill_balance = false
