# Thin-bag A/B on caststation vs casorder_1114_2315 (control, same recipe and latents): captions from
# the position-clause thin_all dry run (anime_tools 0.9.11: --thin_bag --keep_shared_tags
# --bind_view_traits --free_groups, cap 32, no novel tags) + Tag groups --implied + the OCR text clauses, in
# post_image_dataset/moss_src/caststation_thin. Bag 677 / clause 1212 tags over 30 images (live 10-03: ~1011 / 555).
cache = "post_image_dataset/moss/casthin_tags_sure"
output = "output/ckpt_moss/casthin_1115_1150.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true
