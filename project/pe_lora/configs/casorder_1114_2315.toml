# Tag-order A/B on caststation, arm order: caption_format tags = the same tag captions with the flat
# head in the USERGUIDE order (quality, score, meta, year, character, series, artist, then count +
# general; clauses unchanged). Control castag_1114_2315; recipe and latents identical.
cache = "post_image_dataset/moss/casorder_tags_sure"
output = "output/ckpt_moss/casorder_1114_2315.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true
