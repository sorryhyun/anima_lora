# casbox_1115_1226 + clause_hw 1.0 + text_box_hw 1.0: during training the tokens of each position
# clause sit at their 3×3 cell's centre and the tokens inside each boxed text line's quotes at the
# box's centre, on RoPE's h / w axes (docs/moss/proposal/cdpe_text_grounding.md). Same cache, recipe
# and seed. Controls: casbox_1115_1226, casboxr_1116_1149; clause-only arm: cashw_1116_1110.
cache = "post_image_dataset/moss/casbox_tags_sure"
output = "output/ckpt_moss/cashwb_1116_1219.safetensors"
clause_hw = 1.0
text_box_hw = 1.0
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true
