# ama_mitsuki, head + prose captions (the caststation winner, cashead_1112_2310): caption_format
# text, head tag line (rating -> character -> series -> @artist -> count) + "\n" + image-grounded
# PE prose (project/pe_lora/src/rewrite_set.py --vision on), `sure` tail.
# Recipe = ama_mitsuki_int8_add90ema97 (control: layout_json + plain tags 0.2, no tail stamp):
# add90 ema97 self-distill, 106 images x 8 epochs = 848 steps, lr 5e-5; plain_caption_rate 0.
cache = "post_image_dataset/moss/ama_mitsuki_head_text"
output = "output/ckpt_moss/amahead_1112_2315.safetensors"
model = "base"
epochs = 8
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 5e-5
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.1
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "ema"
distill_sigma_min = 0.9
distill_ema_decay = 0.97
distill_add = 1.0
