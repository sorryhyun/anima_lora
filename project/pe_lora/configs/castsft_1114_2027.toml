# Control for norating_1114_1945: caststation_e16_sft's recipe retrained on the current
# channel_(caststation)_layout_sure cache (re-encoded 2026-11-13 18:40 after the OCR text edits on
# 5 captions), so it differs from norating only by the rating. caststation_e16_sft (2026-11-09)
# trained on the earlier OCR text. layout_json + sure tail, int8 TE, plain FM, 30 images x 16
# epochs = 480 steps, lr 1e-4, plain_caption_rate 0.2.
cache = "post_image_dataset/moss/channel_(caststation)_layout_sure"
output = "output/ckpt_moss/castsft_1114_2027.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.2
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true
