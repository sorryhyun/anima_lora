# ama_mitsuki on the caststation caption line (casbox_1115_1226): MOSS-format captions from
# scripts/moss/captions.py (thin bag, mask_dilate 16, implied cut, variants 4 / dropout 0.1) into
# post_image_dataset/moss_captions/ama_mitsuki, cached caption_format tags with text_boxes,
# caption_variants on and the `sure` tail (latents hardlinked from ama_mitsuki_layout). Flow matching
# only (self-distill lost on caststation), caption variants 0.75. Recipe otherwise = amahead_1112_2315:
# 106 images x 8 epochs = 848 steps, lr 5e-5.
# Controls: amahead_1112_2315 (head + prose), ama_mitsuki_int8_add90ema97 (layout_json); neither had variants.
cache = "post_image_dataset/moss/ama_mitsuki_thin_tags_sure"
output = "output/ckpt_moss/amathin_1115_1545.safetensors"
model = "base"
epochs = 8
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 5e-5
warmup_ratio = 0.05
plain_caption_rate = 0.0
caption_variant_rate = 0.75
ema_window = 0.1
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "off"
