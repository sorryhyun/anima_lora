# casbox_1115_1226 + a gated Base teacher in add mode: on steps with sigma >= 0.95 the flow target
# stays and the teacher MSE is added at the flow term's gradient norm (distill_add 1), but only when
# the teacher's own flow MSE is below the student's on that sample (distill_gate); a plain flow step
# otherwise. Same captions, cache and latents.
# Why add: replace removes the flow term on the steps where palette and large shapes are learned
# (casgate_1115_1409 kept -0.012 of flow-only's -0.027 gain over Base at sigma 0.98) and holds the
# student at the teacher's level, so the gate stayed open on 38 of 45 steps.
# Reads, fixed before the run: (1) open steps fall from 38 toward the flow-only trajectory's 29;
# (2) the saved LoRA's gain over Base at sigma 0.98 returns near -0.027; (3) palette and composition
# against casbox on the sheets. Controls: casbox_1115_1226 (flow only), casgate_1115_1409 (replace + gate).
cache = "post_image_dataset/moss/casbox_tags_sure"
output = "output/ckpt_moss/casgateadd_1115_1532.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "base"
distill_sigma_min = 0.95
distill_add = 1.0
distill_gate = true
