# casbox_1115_1226 trained again, config unchanged (clause_hw off): the retrain floor for the
# clause_hw A/B (cashw_1116_1110, cashwq_1116_1110): how far renders and per-sigma loss move from
# one training run to the next.
cache = "post_image_dataset/moss/casbox_tags_sure"
output = "output/ckpt_moss/casboxr_1116_1149.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true
