# casboxlr_1115_1336 (lr 2e-4) + self-distillation with distill_gate: balanced hybrid95, but on a
# teacher step (sigma >= 0.95) the Base teacher's target is kept only when its own flow MSE is below
# the student's on that sample; the flow target otherwise. Same captions, cache and latents.
# Question: does the gated teacher repair what lr 2e-4 breaks (hands, fine detail) without the blur
# casboxsd_1115_1230 showed? Control: casboxlr_1115_1336 (flow only, lr 2e-4). No ungated lr 2e-4
# distill run exists. 1e-4 twin: casgate_1115_1409.
cache = "post_image_dataset/moss/casbox_tags_sure"
output = "output/ckpt_moss/casgatelr_1115_1409.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 2e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "base"
distill_sigma_min = 0.95
distill_add = 0.0
distill_balance = true
distill_gate = true
