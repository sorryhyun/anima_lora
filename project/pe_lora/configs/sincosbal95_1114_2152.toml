# sincos, balanced hybrid95 (docs/moss/proposal/self_distill_lora.md arm A, with distill_balance):
# Base teacher (image + caption in the TE) replaces FM on steps with sigma >= 0.95, its MSE scaled
# to the FM gradient norm it replaces. Rating-free tag cache (sincos_tags_var re-encoded with the
# rating dropped; latents hardlinked), caption variants 0.75. Recipe otherwise = sincostag_1113_0717
# / sincostagfm_1113_0912 (swap 28 / budget 0.4, 354 images x 8 epochs = 2,832 steps, lr 5e-5).
# Read: teacher_probe LoRA − Base at sigma 0.95 / 0.98 (pass: neither interval above 0).
cache = "post_image_dataset/moss/sincos_tags_var_norating"
output = "output/ckpt_moss/sincosbal95_1114_2152.safetensors"
model = "base"
epochs = 8
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 5e-5
warmup_ratio = 0.05
plain_caption_rate = 0.0
caption_variant_rate = 0.75
ema_window = 0.1
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 28
activation_memory_budget = 0.4
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "base"
distill_sigma_min = 0.95
distill_add = 0.0
distill_balance = true
