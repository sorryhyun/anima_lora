# casboxsd_1115_1230 (balanced hybrid95, lr 1e-4) with distill_gate: on a teacher step (sigma >= 0.95)
# the Base teacher's target is kept only when its own flow MSE is below the student's on that sample;
# the flow target otherwise. Same captions, cache and latents.
# Question: does the gate remove casboxsd's blur (Laplacian var x0.60 against casbox) and leave anything
# over flow only? Controls: casbox_1115_1226 (flow), casboxsd_1115_1230 (ungated). 2e-4 twin: casgatelr_1115_1409.
cache = "post_image_dataset/moss/casbox_tags_sure"
output = "output/ckpt_moss/casgate_1115_1409.safetensors"
model = "base"
epochs = 16
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 1e-4
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.139
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 0
activation_memory_budget = 0.3
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "base"
distill_sigma_min = 0.95
distill_add = 0.0
distill_balance = true
distill_gate = true
