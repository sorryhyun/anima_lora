# sincos, head + prose captions (the caststation winner, cashead_1112_2310): caption_format
# text, head tag line (rating -> character -> series -> @artist -> count) + "\n" + image-grounded
# PE prose (project/pe_lora/src/rewrite_set.py --vision on), `sure` tail.
# Recipe = 1111_2235 (control: sincos layout_json + plain tags 0.2, same add90 ema97 recipe,
# swap 28 / budget 0.4); plain_caption_rate 0. 354 images x 8 epochs = 2,832 steps, lr 5e-5.
cache = "post_image_dataset/moss/sincos_head_text"
output = "output/ckpt_moss/sincoshead_1113_0008.safetensors"
model = "base"
epochs = 8
algo = "lora"
rank = 32
down_init = "kaiming"
optimizer = "muon"
lr = 5e-5
warmup_ratio = 0.05
plain_caption_rate = 0.0
ema_window = 0.1
lora_dtype = "bf16"
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 28
activation_memory_budget = 0.4
swap_h2d_only = true
compile = true
expandable_segments = true

distill = "ema"
distill_sigma_min = 0.9
distill_ema_decay = 0.97
distill_add = 1.0
