# x2 B only on the DINO term from the DINO x1 base: x2bll_1122_1629 with init x1ll_1122_1000 ->
#   x1dll_1123_0821 (the shipped Hub x1/anima_pixel_decoder_base) and the perceptual term LPIPS 0.1
#   -> DINOv3 ViT-S/16 at lambda_dino 245.2. The two change together and are not separated; the
#   rest of the recipe as x2bll (12,000 rollouts, lr 5e-5, no GAN, seed 0, the x2flex data).
# The user (2026-11-23): "init은 배포본인 dino base로 하고, x2 b only로 하자고". No GAN finish
#   is queued behind it.
# 245.2: the weight at which the term's gradient norm over the head equals 0.1 x LPIPS on a trained
#   x2 head (reports/x2_dino_2026_11_23.md, smoke_x2match_dv3s); fixed, so its ratio drifts as the
#   term is minimised.
# Question: the full-length x2 B head on the DINO recipe, for the x2 ship read and as the parent
#   of a later GAN finish. Better or level on the user's read of renders against x2bll -> it
#   replaces x2bll as the x2 regression base (and the Hub x2 file on the user's word). Worse ->
#   the shorter run's pattern (32-px stamp 0.30 -> 0.50 at 2,000 rollouts) did not wash out with
#   length; look at the weight before the GAN step.
# Records it rests on:
#   - x2bll_1122_1629 (LPIPS, init x1ll, 12k): test / text 30.55 / 26.16 dB.
#   - x2dv3sw_1123_0718 (this term at 2k, init x1ll): 29.21 / 25.46 dB against x2lp's 29.75 /
#     25.75; DINO distance 3.14 / 3.38 x 1e-4 against 3.70 / 3.65; the user took the term.
#   - x1dll_1123_0821: the x1 base on the DINO term, same arch as x1ll (depth 3, up 1, width 1024).
# Read: held-out dB + DINO distance against x2bll_1122_1629 (its DINO distance read in the same
#   code), x2_stamp_phase.py --no_phase on the end sheets, and p3_generated.py --x2 with x2bll
#   and this head on the same renders, pair sheets, head columns only; the user's read decides.
# Bars: spread unknown (no seed twin of an x2 B run).
# Cost: 12,000 rollouts at about 0.44 s (x2dv3sw), about 1.5 h + evals.

output_name = "x2dll_1123_1537"
init = "output/pixel_head/x1dll_1123_0821/head.safetensors"
rollouts = 12000
lr = 5e-5
eval_every = 1000
pegan_ratio = 0.0
pegan_start = 0

dino = "facebook/dinov3-vits16-pretrain-lvd1689m"
lambda_dino = 245.2
dino_tiles = 4

seed = 0
