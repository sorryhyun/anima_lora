#     run started on the preview head (reports/x2_full_run_deploy_2026_11_21.md).
# Read: the evals at 500 … 3000 beside x2gft's at 1000; the same places and renders as the twin,
#   labelled. The user's read decides.
# Bars: the x2gft / x2gftw gap.
# Cost: 3,000 rollouts at 1.35 s, about 70 minutes.

