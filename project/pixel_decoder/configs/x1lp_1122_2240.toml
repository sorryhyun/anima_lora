# The LPIPS control of x1dv3s_1122_2240: configs/pixel_head/base_x1.toml (the settings of
#   x1ll_1122_1000) with rollouts 12000 -> 1000 and eval_every 1000 -> 500, nothing else changed
#   in training (scripts/pixel_head/base_x1.py).
# `dino` is set for the read only: it adds the dino_* columns to the eval and no term. The read
#   also gained lpips_null / dino_null (the head's residual with its pixels permuted) at the
#   final eval; both are new in scripts/pixel_head/_x1.py with this pair of runs.
# Question, records, read and bars: x1dv3s_1122_2240.toml.
# Cost: 1,000 rollouts, about 20 minutes with the reads.

output_name = "x1lp_1122_2240"
output_dir = "output/pixel_head"
init = "bench/pixel_readout/results/20261119-1527-mixr_1119_1455/head.safetensors"
points = "0.0577-0.1364:real 0.5:adapter"
target = "xhat0"
adapter = "output/ckpt/release/anima_turbo_4step_v4_longer.safetensors"
pages = "post_image_dataset/pixel_pages"
page_share = 0.33

rollouts = 1000
opt_steps = 16
replay = 64
lr = 5e-5
warmup = 200
lambda_lpips = 0.05
lpips_crop = 512

dino = "facebook/dinov3-vits16-pretrain-lvd1689m"   # read columns only
lambda_dino = 0.0
dino_match_lpips = 0.0

eval_points = "0.03 0.25"
eval_every = 500
start_eval = false
n_sheets = 4

stream = "fp32"
compile = true
seed = 0
