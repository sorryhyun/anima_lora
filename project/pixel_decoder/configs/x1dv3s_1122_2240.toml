# The DINOv3 ViT-S/16 tile term in LPIPS's place on the x1 base recipe: x1lp_1122_2240 with
#   lambda_lpips 0.05 -> 0 and dino_match_lpips 0 -> 0.05 (the DINO term on, its weight by the
#   rule), nothing else changed. Same init (mixr_1119_1455), data, points, seed, LR, 1,000
#   rollouts; the replay draws are the control's (tests/test_pixel_dino.py).
# The term (library/anima/pixel_head_train.py, DinoFeat), after ViTok-v2 (arXiv:2605.05331 §2.4,
#   App. E): 4 random 224-px tiles per update at the same places of the head's output and the
#   original image, frozen DINOv3-S, patch tokens after blocks 3 / 6 / 9 / 12, L2-normalised per
#   token, MSE. The paper does not name the blocks or the tile count: both are this run's choice.
# Changes with the network and is not separated:
#   - the pixels a step reads: LPIPS one 512-px crop (262,144 px), DINO 4 x 224 px (200,704 px);
#   - the weight. LPIPS is fixed at 0.05. lambda_dino is set over the first 8 :real rollouts
#     (inside the 200-step warmup) so that the term's gradient norm over the head equals that of
#     0.05 x LPIPS on the same samples, then fixed. The paper's 500 / 1000 is not used: it sits
#     beside Charbonnier + SSIM on a 5B decoder.
# The user (2026-11-22): "x1 training 이 있는데, 이걸 1k로 학습했을 때 lpips vs dino-based 를 붙여보고
#   싶어"; "ㅇㅋ 해보자 s가 이기면 convnext를 다음으로 해보는걸로".
# Question: at 1,000 rollouts, does the head trained with the DINOv3-S term read better than
#   the LPIPS one? Better or level on the user's read -> the ConvNeXt-T arm (same rule, the
#   stage maps in the tokens' place). Worse -> the recipe keeps LPIPS and the line of
#   project/pixel_decoder/lpips_alternatives.md stops at this arm unless the user reopens it.
# Records it rests on:
#   - ViTok-v2 Table 2 (5B decoder, r 12, ImageNet 256): + LPIPS rFID 0.72 / SSIM .923,
#     + DINO rFID 0.51 / .919 (lambda 250) and 0.30 / .914 (lambda 1000). Photos, no GAN.
#   - archive/real_target_2026_11_19.md (local): lambda_lpips 0.05 is about 3x the
#     reconstruction term's gradient norm on the release head (unweighted ratio 71, 8 rollouts).
#     This run reads the same three norms (result.json, dino_match).
# Read: both heads at 1,000 rollouts. (1) Held-out, test 30 / text 8 / manga 10, at the read
#   points: dB against the original, LPIPS, the DINO distance, and each distance's
#   permuted-residual null. Each arm has its own distance in its loss: the other arm's distance
#   and dB are the columns that are not won by construction. (2) Generated, P3's 16 prompts x
#   seeds 0, 1, base 28 steps CFG 4: bench/pixel_readout/p3_generated.py with both heads
#   (x1dv3sb28_1122_2240), pairwise sheets control | arm, labelled; the user's read decides.
# Bars: 0.06 dB / 0.0013 LPIPS on test is the realr_1119_2200 / x1twin_1121_2230 gap at 3,000
#   rollouts and LR 2e-4 (reports/x1_recipe_2026_11_22.md). At 1,000 rollouts and LR 5e-5, and
#   for the DINO distance: spread unknown.
# Cost: 1,000 rollouts, about 20 minutes with the reads; the render read about 7.

output_name = "x1dv3s_1122_2240"
output_dir = "output/pixel_head"
init = "bench/pixel_readout/results/20261119-1527-mixr_1119_1455/head.safetensors"
points = "0.0577-0.1364:real 0.5:adapter"
target = "xhat0"
adapter = "output/ckpt/release/anima_turbo_4step_v4_longer.safetensors"
pages = "post_image_dataset/pixel_pages"
page_share = 0.33

rollouts = 1000
opt_steps = 16
replay = 64
lr = 5e-5
warmup = 200
lambda_lpips = 0.0
lpips_crop = 512                       # the weight rule's LPIPS crop

dino = "facebook/dinov3-vits16-pretrain-lvd1689m"
lambda_dino = 0.0                      # set by the rule
dino_tiles = 4
dino_match_lpips = 0.05

eval_points = "0.03 0.25"
eval_every = 500
start_eval = false
n_sheets = 4

stream = "fp32"
compile = true
seed = 0
