# The x1 GAN finish on the DINO base: configs/pixel_head/x1.toml with init x1dll_1123_0821
#   (the shipped base, Hub x1/anima_pixel_decoder_base) in place of x1ll_1122_1000. 2,000
#   rollouts, LR 5e-5 one new cosine, PE-GAN ratio 2 on the :real samples, whole image, PE eager;
#   DINO term λ 331.6 in place of x1fgan's LPIPS 0.05. Code: scripts/pixel_head/train_x1.py.
# The user (2026-11-23): "픽셀 디코더 x1 gan finetune 2k 돌리자 5e-5로".
# Question: does the GAN finish on the DINO base sharpen as x1fgan_1122_1247 did on x1ll, with
#   the base's screentone kept? Yes on the user's read -> the release sharp file.
# Records it rests on:
#   - x1fgan_1122_1247 (x1ll + the same finish, LPIPS): test 33.33 dB at σ 0.0577 against the
#     base's 34.25; high-pass amplitude on base renders 0.880 / 0.850 -> 0.986 / 0.941 of the
#     VAE's; 1.89 s per rollout, 66 min, peak 14.3 GB (plan.md, "The GAN finish on the ×1 base").
#   - x1dll_1123_0821 against x1ll: DINO distance 12 - 34 % lower at σ ≤ 0.25, PSNR 0.15 - 0.25
#     dB lower (plan.md, State).
# Read: evals (dB, DINO distance) beside x1dll's; generated sheets base | finish, labelled; the
#   user's read decides.
# Bars: no twin at this LR and parent; spread unknown.
# Cost: 2,000 rollouts at about 1.9 s: about 65 min + evals.

output_name = "x1dgan_1123_1059"
output_dir = "output/pixel_head"       # → <output_dir>/<output_name>/head.safetensors
init = "output/pixel_head/x1dll_1123_0821/head.safetensors"
points = "0.0577-0.1364:real 0.5:adapter"
target = "xhat0"
adapter = "output/ckpt/release/anima_turbo_4step_v4_longer.safetensors"
pages = "post_image_dataset/pixel_pages"
page_share = 0.33

rollouts = 2000                        # the points alternate: half of them carry the term
opt_steps = 16
replay = 64
lr = 5e-5
warmup = 200
dino = "facebook/dinov3-vits16-pretrain-lvd1689m"
lambda_dino = 331.6                    # on the :real points
dino_tiles = 4

pegan_ratio = 2.0                      # GAN gradient norm over the head / the regression terms'; 0 = off
pegan_crop = 0                         # 0 = the whole image; the PE tower runs eager
pegan_lr = 1e-4
pegan_lambda_max = 1.0

eval_points = "0.03 0.25"
eval_every = 500
start_eval = false
n_sheets = 4

stream = "fp32"
compile = true
seed = 0
