# RGBA R1, LR check: rgbar1_1122_1515's full with LR 5e-5 -> 2e-4, nothing else changed
# (same images, backgrounds, noise, output init, draw order, 6,000 steps).
# Question: is what full misses on the fit images (thin double lines merged, 8-px patch marks)
#   the LR of the recipe or the head's form? Much closer at 2e-4 -> R2's form is full and its LR /
#   length is R2's to set. The same marks -> the head's form (plan.md, Open) before a longer run.
#   full only, by the user's word ("누가 up out 돌리래; full만 돌려"); a first submit that also
#   held up at 2e-4 (job 20261122-153554-0a4c9c) was killed before it trained.
# Records it rests on:
#   - rgbar1_1122_1515, fit L1 all / transition: up 0.0818 / 0.2286, full 0.0047 / 0.0730;
#     out 0.2485 -> out_2e4 0.2108 (LR alone moved it).
# Read: the same columns and sheets as the parent, labelled; the user's read decides.
#   One reference added: the flood null with B free of grain (the parent's was handed the grain,
#   which the decode drops, and failed on those backgrounds).
# Bars: the parent's up / up_twin gap, fit L1 0.0009.
# Cost: 144 forwards, 1 arm x 6,000 head steps; about 6 min.
output_name = "rgbar1lr_1122_1535"
stage = "r1"
cutouts = "{CAPTION_CORPUS_DIR}/transparent"
bg_source = "image_dataset"
init = "output/pixel_head/x1ll_1122_1000/head.safetensors"
n_fit = 16
sigma_lo = 0.0577
sigma_hi = 0.1364
arms = "full_2e4"
steps = 6000
warmup = 200
eval_every = 1500
stream = "fp32"
compile = true
seed = 0
