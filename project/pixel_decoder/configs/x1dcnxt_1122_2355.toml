# The DINOv3 ConvNeXt-T term in the ViT-S one's place: x1dv3s_1122_2240 with dino
#   dinov3-vits16 -> dinov3-convnext-tiny, nothing else changed (same init mixr_1119_1455, data,
#   points, seed, LR, 1,000 rollouts, 4 x 224-px tiles, the weight rule at LPIPS 0.05).
#   dino_read keeps the read's dino_* columns on ViT-S, the meter of the two earlier runs.
# Changes with the network and is not separated: what is compared. ViT-S: patch tokens after
#   blocks 3 / 6 / 9 / 12, all at 16 px. ConvNeXt-T: the four stage maps, at 4 / 8 / 16 / 32 px
#   per position, L2-normalised per position; MSE over elements weighs a stage by 1 / its width
#   (96 / 192 / 384 / 768), so the 4-px stage counts 8x the 32-px one. The paper's formula on
#   the stage maps as they come; no published use of this network as a loss.
# The user (2026-11-22, after the x1dv3s pair sheets): "ㅇㅇ convnext-T 해보자 내생각에 이걸 lpips
#   대체로까지 고려할만할듯?".
# Question: which DINOv3 network goes on against LPIPS? The better of the two on the user's read
#   -> the arm of the next comparison (longer training, or the x2 recipe:
#   project/pixel_decoder/lpips_alternatives.md, Plan). Level -> ViT-S, the published form.
# Records it rests on:
#   - reports/x1_dino_2026_11_22.md: x1dv3s against x1lp at sigma 0.0577, dB / LPIPS: test
#     33.65 / 0.0801 against 33.87 / 0.0786, text 28.68 / 0.0624 against 28.77 / 0.0655, manga
#     26.03 / 0.0931 against 26.13 / 0.1033; generated renders, colour / mono: high-pass share of
#     the VAE's 0.912 / 0.881 against 0.881 / 0.853, 16-px stamp 0.62 / 1.33 against 0.43 / 0.97.
#   - DINOv3 (arXiv:2508.10104) Tables 14, 15: ADE20k / NYU ViT-S 47.0 / 0.403, ConvNeXt-T
#     42.7 / 0.448, on two protocols.
# Read: the head at 1,000 rollouts against x1dv3s_1122_2240 and x1lp_1122_2240. (1) Held-out,
#   as those runs: dB, LPIPS, the ViT-S distance. (2) Generated, P3's 16 prompts x seeds 0, 1,
#   base 28 steps CFG 4, the three heads on the same renders (x1dcnxtb28_1122_2355): high-pass
#   share and the 16-px / 8-px stamp (bench/pixel_readout/sheet_texture.py), pair sheets
#   x1dv3s | x1dcnxt, labelled; the user's read decides.
# Bars: 0.06 dB / 0.0013 LPIPS on test is the realr_1119_2200 / x1twin_1121_2230 gap at 3,000
#   rollouts and LR 2e-4. At 1,000 rollouts, and for the stamp and the DINO distance: spread
#   unknown.
# Cost: 1,000 rollouts, about 20 minutes with the reads; the render read about 8.

output_name = "x1dcnxt_1122_2355"
output_dir = "output/pixel_head"
init = "bench/pixel_readout/results/20261119-1527-mixr_1119_1455/head.safetensors"
points = "0.0577-0.1364:real 0.5:adapter"
target = "xhat0"
adapter = "output/ckpt/release/anima_turbo_4step_v4_longer.safetensors"
pages = "post_image_dataset/pixel_pages"
page_share = 0.33

rollouts = 1000
opt_steps = 16
replay = 64
lr = 5e-5
warmup = 200
lambda_lpips = 0.0
lpips_crop = 512                       # the weight rule's LPIPS crop

dino = "facebook/dinov3-convnext-tiny-pretrain-lvd1689m"
dino_read = "facebook/dinov3-vits16-pretrain-lvd1689m"   # the read's meter, as the earlier runs
lambda_dino = 0.0                      # set by the rule
dino_tiles = 4
dino_match_lpips = 0.05

eval_points = "0.03 0.25"
eval_every = 500
start_eval = false
n_sheets = 4

stream = "fp32"
compile = true
seed = 0
