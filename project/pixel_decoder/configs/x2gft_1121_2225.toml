# through scripts/pixel_head/train_x2.py instead of bench/pixel_readout/x2_head.py.
# Changed together with the ratio, not separated: the loop (the library entry: head at scale=2,
#   no ×1 term at weight 0, no --term_log draws; its GAN path runs on the card for the first
#   time here; x2move_1121_1350 read the no-GAN path level with the bench loop at rollout 125).
# Against the shipped x2bgan2_1121_1340 the difference is the schedule only in intent: the term
#   on a converged head for 1,000 rollouts, instead of from rollout 1000 of 4,000 on a moving one.
# Question: does the ratio-2 term, put on the converged head, give the shipped file's lines
#   without its tiled pattern on fine texture? Yes -> this head replaces
#   anima_pixel_head_x2.safetensors on the user's read. Tile still there -> the schedule is not
#   the cause; next is a noise input on the ×2 stage. No tile but lines read softer -> ratio /
#   length on this form, read against x2gan4.
# Records it rests on:
#   - the tile, one place, labelled, Claude's read (2026-11-21): held-out text_04_10841155, ×2
#     output y 32 / x 1440, 128 px: 16-px pinwheel tiles on x2bgan2_1121_1340; a faint mesh on
#     x2b4k_1121_0950 and x2gctl_1121_1120; a sharper mesh on x2gan1; irregular grain on x2gan4.
#     The user's own render shows the same tiles, and the card's monochrome ×2 sample
#     (deploy/README.md, "wavy pattern" on the shorts) is the user's second instance.
#   - x2gan1 / x2gctl / x2gan4 at rollout 1000, test 12 / text 5 against the real 2× image:
#     29.93 / 25.49 dB, LPIPS 0.153 / 0.144; 30.18 / 25.57, 0.145 / 0.142; 29.50 / 25.23,
#     0.186 / 0.180 (reports/x2_gan_micro_2026_11_21.md). x2bgan2 at 4000: 29.82 / 25.52,
#     0.158 / 0.145.
#   - x2bgan2's GAN weight: 0.151 at rollout 1050 (head LPIPS 0.27, LR at 0.85 of peak), 0.012
#     at 1250, 0.006 at 4000 (reports/x2_full_run_deploy_2026_11_21.md).
# Read: (1) evals at 250 / 500 / 750 / 1000 beside the micro arms' rows; (2) the text_04 place
#   above, this run beside x2bgan2, labelled, Claude's read: tiles or none; (3) the card's
#   monochrome ×2 render (base 28 steps, CFG 4, seed 42) with this head beside the shipped one,
