# x2 GAN finish at a GAN weight under the regression's: x2gf1k_1124_1256 with pegan_ratio 2.0 ->
#   0.5, nothing else changed (resume x2ovll_1124_0139, 1,000 rollouts on one cosine, LR 2e-5,
#   window 32 on manifest_w32, DINOv3 ViT-S/16 at 245.2, PE-GAN from rollout 0 on a 512 crop,
#   disc LR 1e-4, seed 0). The ratio is the GAN term's gradient norm over the head against that
#   of rec + DINO + dc; at 2.0 the GAN term outweighs them, at 0.5 they outweigh it, as in the
#   usual upscaler recipes (L1 1 : perceptual 1 : GAN 0.1).
# The user (2026-11-24): "flat pixel high pass 등 다 좀 애매해서... gan + dino(lpips) + mse 가 정석
#   upscaler잖아", then on this arm "ㅇㅋ 1번 해보자".
# Question: with the regression terms above the GAN term, does the pattern on flat colour fall
#   faster than the sharpness? Flat-token grain, the sky patch's 8-px fold and stamp32 under the
#   alpha line (x2ovll -> x2ovgf mixes) at this arm's amp -> the ratio is a different dial from
#   alpha; a 4,000-rollout finish at this ratio is proposed against x2ovgf. On the alpha line or
#   above it -> the ratio is a strength dial like alpha and the unpaired arm; the output form
#   (a convolution tail at pixel resolution) is the next proposal. amp at x2ovll's -> the term
#   is too weak at 0.5 to read; 1.0 is the value between.
# Records it rests on:
#   - reports/x2_unpaired_2026_11_24.md: the control reads amp 0.723 / 0.688, stamp32 0.607 /
#     2.800, flat-token grain 0.41, sky patch 0.45 / 8-px fold 0.27, margin 7.08 and lam_pegan
#     0.024 over its last 250 rollouts, held out 29.91 / 25.66 dB; x2ovll 0.603 / 0.620, 0.414 /
#     1.573, 0.23, 0.28 / 0.09.
#   - reports/x2_ovgf_mix_2026_11_24.md: the alpha line, alpha 0 / 0.5 / 1: amp 0.603 / 0.667 /
#     0.771, stamp32 0.414 / 0.517 / 0.657, flat-token grain 0.23 / 0.29 / 0.39 (a 4,000-rollout
#     finish; the control at 1,000 sits off it at 0.723, 0.607, 0.41).
#   - reports/x2_tile_gft_2026_11_22.md: ratios 1 and 4 on the 8 x 8 output from x2b4k; no ratio
#     under 1 in the records.
# Not known before the run: whether the discriminator's margin saturates at 7 at this ratio.
# Read: the margin and lam_pegan beside the control's; evals beside the control's;
#   p3_generated.py --x2 on the 32 renders with the control | this arm, sheet_texture.py --x2
#   --pairs, tile_dict.py, the sky patch's 8-px fold; labelled pair sheets with the two regions
#   the user read on x2ovgf; the user's read decides.
# Bars: spread unknown; no twin of a 1,000-rollout finish.
