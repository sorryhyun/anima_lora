# x2 GAN finish with the reference code's slope term on the discriminator: x2gf1k_1124_1256
#   with pegan_r 0.1 -> 2500, nothing else changed (resume x2ovll_1124_0139, 1,000 rollouts on
#   one cosine, LR 2e-5, window 32 on manifest_w32, DINOv3 ViT-S/16 at 245.2, PE-GAN ratio 2.0
#   from rollout 0 on a 512 crop, disc LR 1e-4, sigma 0.01, seed 0). R1 / R2 here is
#   pegan_r * mean((D(x + sigma n) - D(x))^2); the reference code
#   (github.com/apple-aiml-research/ml-fastframes at a65c592, dinov3_discriminator.py) has
#   0.25 * mean(((D(x + eps n) - D(x)) / eps)^2) at eps 0.01, which is 2,500 on the same
#   difference. reports/x2_slope_2026_11_24.md.
# The user (2026-11-24): "내생각에 slope 항을 2500으로 거는게 중요한것 같아. 문제가... 그 32픽셀
#   격자? 같은게 더 심해져서 slope를 거는게 맞을듯" (with a screenshot of a dot grid on a grey
#   gradient).
# Question: does the discriminator stop separating on sub-level high-frequency content when
#   its slope is held to the reference's, and does the fixed pattern go with it? The margin
#   under the control's 7.05 with stamp32 (mono first: the 32-px grid the user read), the
#   flat-token grain and the sky patch's 8-px fold under the alpha line at this arm's amp ->
#   the slope term is the recipe's; the 4,000-rollout finish with it is proposed, at ratio 0.5
#   or 2.0 by the amp it leaves. The margin under 7 with amp at x2ovll's -> the discriminator
#   is held too flat on this tower to push the head; a weight between (25, 250) is next. The
#   margin and the numbers at the control's -> the slope was not what the pattern came from;
#   the cap at 0.2 in RGB space and the DINO tower at 224 px are the other differences left.
# Records it rests on:
#   - reports/x2_unpaired_2026_11_24.md: the control reads amp 0.723 / 0.688, stamp32 0.607 /
#     2.800, flat-token grain 0.41, sky patch 0.45 / 8-px fold 0.27, margin 7.05 over its last
#     250 rollouts, held out 29.91 / 25.66 dB; x2ovll 0.603 / 0.620, 0.414 / 1.573, 0.23,
#     0.28 / 0.09.
#   - reports/x2_ratio_2026_11_24.md: d_r1 / d_r2 0.03 - 0.10 over a run at pegan_r 0.1 (the
#     logit moves 0.2 - 0.3 for noise of 1.3 levels); margin 7.0 - 7.5 at ratio 2.0 and 0.5.
#   - reports/x2_slope_2026_11_24.md: the table of differences from the reference code.
# Not known before the run: whether PE's frozen tower in bf16 leaves a rounding floor under
#   the difference that the heads can only lower by flattening every logit (the reference runs
#   its DINO tower in bf16 as well); the slope term here acts on the one crop of each update,
#   the reference's on a quarter of 16 crops.
# Read: d_r1 / d_r2, the margin and lam_pegan beside the control's; evals beside the
#   control's; p3_generated.py --x2 on the 32 renders with the control | this arm,
#   sheet_texture.py --x2 --pairs, tile_dict.py, the sky patch (the box of
#   reports/x2_ratio_2026_11_24.md); labelled pair sheets, the mono renders first; the user's
#   read decides.
# Bars: spread unknown; no twin of a 1,000-rollout finish.
# Cost: 1,000 rollouts at about 0.96 s: about 18 min, + a 5-min render read.
# make daemon-run ARGS="--queue --stall-timeout 900 scripts/pixel_head/train_x2.py --config <this file>"

