# The reference read of x1dll_1123_0821: x1ll_1122_1000's head read by scripts/pixel_head/base_x1.py
#   with rollouts 0, so its held-out table carries the DINO columns (its own record has LPIPS).
#   Same held-out sets, read points, noise seed and DINO network as the run; no training.
# Question, read and bars: x1dll_1123_0821.toml.
# Cost: held-out features and the final read, about 10 minutes.

output_name = "x1llread_1123_0821"
output_dir = "output/pixel_head"
init = "output/pixel_head/x1ll_1122_1000/head.safetensors"
points = "0.0577-0.1364:real 0.5:adapter"
target = "xhat0"
adapter = "output/ckpt/release/anima_turbo_4step_v4_longer.safetensors"
pages = "post_image_dataset/pixel_pages"
page_share = 0.33

rollouts = 0
lambda_dino = 331.6
dino = "facebook/dinov3-vits16-pretrain-lvd1689m"

eval_points = "0.03 0.25"
n_sheets = 4

stream = "fp32"
compile = true
seed = 0
