#   tone? amp near x2ovgf's with stamp32 and the flat-token grain at or under x2ovgf's -> the
#   finish is low rank; the full-length run at this rank and the LoRA as the file's form are what
#   to propose. amp up with stamp32 and grain like the cut's (x2rk's top 8) -> the balance needs
#   the diffuse part; rank 64 or the full finish stays. amp not up -> too short or the LR is off
#   (the margin's course and lam_pegan tell which); a longer run before any reading of rank.
