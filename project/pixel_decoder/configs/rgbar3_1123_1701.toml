# RGBA R3, shortened: rgbar2_1122_1550 with rollouts 1,000 -> 4,000, LR 5e-5 -> 2e-5 and the
#   perceptual term LPIPS 0.05 (512 crop) -> DINOv3 ViT-S/16 at lambda_dino 331.6 (the x1 weight,
#   unmeasured on alpha; the trainer has no LPIPS since 2026-11-23). The three change together,
#   not separated. Same cache (rgbacache_1122_1550), init x1ll_1122_1000, one cosine, warmup 200,
#   seed 0.
# The user (2026-11-23), on the LR: "rgba는 2e-5로 하자. 이미 베이스는 픽셀을 잘 출력하는데 그 중
#   선택적으로 a만 학습하면 되는 문제니 lr 낮춰도 될거같아". Against it on record: the cancelled
#   rgbar1lr_1122_1535 (2e-4) at 4,500 updates fit L1 0.0015 / transition 0.0224 against
#   0.0049 / 0.0768 at 5e-5. Σ LR here (4,000 x 2e-5) is 1.6x R2's (1,000 x 5e-5).
# The user (2026-11-23): "12k는 많고 4k 정도로, 체크포인트는 2k 한번만", queued behind
#   x2dgf512_1123_1701. rgba_plan.md R3 had 12,000 with a file every 3,000.
# The 2,000 file is mid-cosine (LR about half its peak), not a 2,000-rollout run.
# Question: do the blocks (flat mid tiles in white-on-white regions) fall with length?
#   Fall from R2 to 2k to 4k -> length is the fix; the ship-set read follows.
#   Level with R2 at 2k and 4k -> data: white-on-white cutouts before more length.
# Records it rests on (rgbar2_1122_1550, 1,000 rollouts, reports/rgba_refine_2026_11_22.md):
#   - held-out L1, other: white foreground 0.0432, background-like foreground 0.0400, holes
#     0.1209, transition 0.2104.
#   - 8 working renders: flat mid 8 x 8 tiles 598 (oldman s1 227, bicycle s1 191).
#   - 0.55 s a rollout.
# Read: per file (2k, 4k) the held-out L1 above, the 8 renders' tile count (render_alpha.py),
#   composite and alpha sheets of oldman s1 and bicycle s1, the other_white_fg sheet.
# Bars: spread unknown (no seed twin).
# Cost: 4,000 rollouts at about 0.55 s: about 37 min + evals.
# make daemon-run ARGS="--queue --stall-timeout 900 scripts/pixel_head/train_alpha.py --config <this file>"
output_name = "rgbar3_1123_1701"
output_dir = "output/pixel_head"
cache_dir = "post_image_dataset/pixel_alpha"
init = "output/pixel_head/x1ll_1122_1000/head.safetensors"
rollouts = 4000
opt_steps = 16
sigma_lo = 0.0577
sigma_hi = 0.1364
stream = "fp32"
replay = 64
lr = 2e-5
warmup = 200
dino = "facebook/dinov3-vits16-pretrain-lvd1689m"
lambda_dino = 331.6
dino_tiles = 4
eval_every = 250
save_every = 2000
compile = true
seed = 0
