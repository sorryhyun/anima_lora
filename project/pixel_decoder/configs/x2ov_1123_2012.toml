# Overlapping x2 output: a B-only finetune of x2dll_1123_1537 with overlap false -> true
#   (out2 writes 16x16 patches at stride 8, summed under a sin^2 window; the 8x8 layer is
#   converted with its edge pixels repeated outwards, library/anima/pixel_head.py). The rest as
#   x2dll: lr 5e-5, DINO 245.2, no GAN, seed 0, the x2flex data, window 24.
# Not separated from the output layer: 2,000 more rollouts on a new cosine (x2dll has 12,000).
#   A warm start dips under its init's dB early (README, x1 training); 2,000 may end a little
#   under x2dll's.
# The user (2026-11-23, on the boxes of the candle crops and the three fixes offered): "일단 이
#   박스 패턴은 좀 그러니까 a는 바로 적용하자".
# Question: does an output that overlaps remove the 8-px patch and 32-px token steps on flat
#   regions without costing detail? Border ratios near the chain's 1.0 and the user's read of
#   candle / kotatsu level or better -> the output form of every x2 head from here, and the
#   GAN finish is rerun on it. Ratios down but detail softer on the user's read -> a longer run
#   before a verdict. Ratios kept -> the steps come from the trunk, not out2.
# Records it rests on (reports/x2_noise_2026_11_23.md, "The box grid"; x2_dll_dgf_2026_11_23.md):
#   - x2dll_1123_1537 on 32 renders, flat tokens: inner first difference 0.22 levels, patch
#     borders x1.23, token border x1.35 (chain x1.01 / x1.00); whole-image token edge ratio 1.233.
#   - x2dll held out: 30.48 / 26.13 dB, DINO 2.49 / 2.72 x 1e-4; 12k B run at about 0.44 s a rollout.
# Read: evals beside x2dll's; p3_generated.py --x2 with x2dll and this head on the same 32 renders
#   (x2ovgen), tile_dict.py on them (flat-token border ratios, edge ratio, departed tiles), pair
#   sheets x2dll | this arm of candle, kotatsu, manga_page, labelled; the user's read decides.
# Bars: no twin of a x2 B run; spread unknown.
# Cost: 2,000 rollouts at about 0.45 s: about 15 min + evals; the render read about 12.
# make daemon-run ARGS="--queue --stall-timeout 900 scripts/pixel_head/train_x2.py --config <this file>"

output_name = "x2ov_1123_2012"
