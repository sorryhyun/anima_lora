# RGBA R0: forward only, the x1 base head and the VAE on cutouts over light backgrounds
# (project/pixel_decoder/rgba_plan.md R0). Parent: x1ll_1122_1000, read only, nothing trains.
# Changed together, not separated: cutouts for the cached set's images, and their backgrounds
# (white | flat light colour | light gradient + grain, from image_dataset's simple backgrounds).
# Question: do thin strokes and translucency survive the tap (DiT x0-hat at the decode sigmas),
#   on colour as on white? Yes -> R1 says how much of the head has to train. Gone in VAE(x0-hat)
#   already -> recorded as out of reach at this tap, not chased by training.
#   Generated backgrounds not flat / affine -> the decode's B follows what is measured here.
# Records it rests on:
#   - reports/x1_recipe_2026_11_22.md: the base at sigma 0.0577 against the original, test 30:
#     34.25 dB / LPIPS 0.0725; VAE(x0-hat) 35.11 / 0.0560.
# Read: VAE(x0-hat) and the base head against the composite, VAE(x0) as the codec's ceiling,
#   kept contrast (1 = kept, 0 = became background); sheets original | VAE(x0-hat) and
#   VAE(x0-hat) | head, labelled; the user's read decides.
# Bars: spread unknown.
# Cost: 192 forwards, 30 renders at 28 steps; about 8 min.
output_name = "rgbar0_1122_1515"
stage = "r0"
cutouts = "{CAPTION_CORPUS_DIR}/transparent"
bg_source = "image_dataset"
init = "output/pixel_head/x1ll_1122_1000/head.safetensors"
n_fit = 16
sigma_lo = 0.0577
sigma_hi = 0.1364
stream = "fp32"
compile = true
seed = 0
