# The DINOv3 ViT-S/16 term on the x2 B-only recipe at a weight read on a trained head:
#   x2dv3s_1123_0025 with lambda_dino 54.9 (the rule, on the untrained second stage) -> 245.2
#   (fixed, dino_match_lpips 0.1 -> 0), nothing else changed. The control is x2lp_1123_0025.
# 245.2: the weight at which the term's gradient norm over the head equals that of 0.1 x LPIPS on
#   x2dv3s_1123_0025's end head (smoke_x2match_dv3s, 8 windows; 89.5 on the control's end head).
#   At the untrained second stage it is 4.5x the earlier run's pull: 245.2 x 0.0061 = 1.5
#   against rec2's 5.3 (reports/x2_dino_2026_11_23.md).
# Not separated from the network, as before: the pixels a step reads (LPIPS 589,824 px, DINO
#   4 x 224 px). The weight is fixed, so the ratio to LPIPS drifts as the term is minimised.
# The user (2026-11-23, on the proposal of this rerun): "ㅇㅋ dino arm 해보자".
# Question: at a weight matched on a trained head, does the DINO head read better than the
#   LPIPS one at 2,000 rollouts? Better or level on the user's read, with the fixed pattern no
#   worse -> the term is the candidate for the x2 recipe (a full-length B run, on the user's
#   word). Pattern worse (the 32-px stamp up, the grid visible) -> x2 keeps LPIPS.
# Records it rests on: reports/x2_dino_2026_11_23.md (x2lp_1123_0025 29.75 / 0.172 and 25.75 /
#   0.169; x2dv3s_1123_0025 29.69 / 0.233 and 25.75 / 0.202; the stamps; the two nulls).
# Read: as x2dv3s_1123_0025's header, against x2lp_1123_0025: held-out, x2_stamp_phase.py
#   --no_phase, and p3_generated.py --x2 with the three heads on the same renders
#   (x2dv3swb28_1123_0718), pair sheets control | this arm, head columns only, labelled; the user's
#   read decides.
# Bars: spread unknown.
# Cost: 2,000 rollouts at 0.46 s, about 20 minutes with the evals; the render read about 12.

output_name = "x2dv3sw_1123_0718"
init = "output/pixel_head/x1ll_1122_1000/head.safetensors"
rollouts = 2000
lr = 5e-5
eval_every = 500
pegan_ratio = 0.0
pegan_start = 0
lambda_lpips = 0.0

dino = "facebook/dinov3-vits16-pretrain-lvd1689m"
lambda_dino = 245.2
dino_tiles = 4
dino_match_lpips = 0.0

seed = 0
