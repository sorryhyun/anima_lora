#   sheet_texture.py --x2 --pairs, the sky patch and the halftone box (the boxes of
#   reports/x2_ratio_2026_11_24.md); labelled pair sheets; the user's read decides.
# Bars: spread unknown; no twin of a 1,000-rollout finish.
