# x2 GAN finish with the discriminator in the reference code's form: x2slr05_1124_2316 with
#   the discriminator moved from PE-Spatial-B16 (blocks 3 / 7 / 11, convolutional heads) on one
#   512-px crop to DINOv3 ViT-S/16 (blocks 3 / 7 / 11 = the reference's layers 4 / 8 / 12,
#   per-token MLP heads of width 128) on 16 crops of 224 px, with the reference's centring term
#   0.01 * mean((D(real) + D(fake))^2) and its slope terms on a quarter of the crops (DinoDisc
#   in scripts/pixel_head/train/_common.py; github.com/apple-aiml-research/ml-fastframes at
#   a65c592, dinov3_discriminator.py and configs/ffs_decoder_gan.yaml). Kept from x2slr05:
#   resume x2ovll_1124_0139, 1,000 rollouts on one cosine, LR 2e-5, window 32 on manifest_w32,
#   the DINO feature term at 245.2, pegan_r 2500, sigma 0.01, disc LR 1e-4, pegan_ratio 0.5 over
#   the head with pegan_lambda_max 1.0 from rollout 0, the paired real crop, seed 0.
# The user (2026-11-24), after x2slr05's read: "뭘까.... dino로 해보자 그럼".
# Changed together, so the run cannot separate them: the tower, the crops (size and count),
#   the heads, the centring term, the slope terms' share of the crops. Not taken from the
#   reference: its cap on the adversarial gradient per sample at the RGB output, its 25
#   discriminator-only updates and ramp, its unpaired real crop, its temporal heads.
# Question: does the token tile on fine colour texture come with this discriminator's tower
#   and crops? castle s0 / s1 departed at or under x2gf1k_1124_1256's 0.024 / 0.032 with amp
#   over x2r05_1124_1908's 0.687 / 0.659 and flat colour no more patterned than x2slr05's ->
#   the reference's discriminator is the form; its 4,000-rollout finish is proposed, and the
#   single changes (tower at one 512 crop, crops on PE) can follow. castle departed near
#   x2slr05's 0.066 / 0.076 -> the tile does not come from PE or the crop; the cap at the RGB
#   output is the difference left, and x2r05gf_1124_1941 stays the candidate. amp at
#   x2ovll's 0.603 / 0.620 with the margin near 0 -> this discriminator does not push the
#   head at this ratio (the tower probe below); read lam_pegan_raw before a second arm.
# Records it rests on:
#   - reports/x2_slope_2026_11_24.md: x2slr05 reads castle s0 / s1 departed 0.066 / 0.076,
#     neon_rain s0 0.061, amp 0.754 / 0.718, stamp32 0.591 / 2.715, flat-token grain 0.33, sky
#     patch 0.35 / 8-px fold 0.14, halftone box 23.35 / 32-px fold 14.91, margin 0.19 over its
#     last 250 rollouts, lam_pegan_raw 0.57 - 0.73 in its second half, held out 29.81 /
#     25.49 dB; x2r05_1124_1908 (ratio 0.5, no slope term) castle s0 0.003, amp 0.687 / 0.659.
#   - README, "GAN term" (discprobe_1123_1108): as a linear probe of the original against a
#     head's output DINOv3 ViT-S/16 reads 0.709 / 0.743 unpaired, PE 0.880 / 0.894; read on
#     whole images with no slope term.
# Not known before the run: the weight this discriminator's gradient gets under the ratio
#   rule (lam_pegan_raw says whether the cap cut it); whether 224-px crops of a 1,024-px
#   window, 7 tokens a side, show the tile to the discriminator at all.
# Read: castle s0 / s1 and neon_rain s0 first (tile_dict.py's departed share, 1:1 crops),
#   then lam_pegan_raw, the margin, d_r1 / d_r2 / d_center beside x2slr05's; evals beside
