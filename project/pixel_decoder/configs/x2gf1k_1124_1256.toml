# x2 GAN finish at 1,000 rollouts, the paired control: x2ovgf_1124_0920 with rollouts 4,000 ->
#   1,000 (one cosine over 1,000), nothing else changed (resume x2ovll_1124_0139, LR 2e-5, window
#   32 on manifest_w32, DINOv3 ViT-S/16 at 245.2, PE-GAN ratio 2 from rollout 0 on a 512 crop,
#   disc LR 1e-4, seed 0).
# The user (2026-11-24): "unpaired로 해볼만은 한것같아. 1k로도 대조할만한 컨트롤 있어?", then "뭐 ㅇㅋ
#   그러자" to a matched 1k pair. No full-finetune head at 1,000 rollouts exists: x2ovgf kept its
#   last file only, and its rollout 1,000 sat on a 4,000-rollout cosine.
# Question: none of its own. It is the control of x2unp_1124_1256 and of later 1k arms on this
#   recipe (the flat-token term).
# Records it rests on:
#   - reports/x2_ovgf_mix_2026_11_24.md: x2ovgf at its rollout 1,000 29.61 / 25.46 dB, DINO
#     0.284 / 0.306 x 1e-3; the margin 7.0 - 7.2 over its last 450 rollouts.
# Read: with x2unp_1124_1256 (its header).
# Bars: spread unknown.
# Cost: 1,000 rollouts at about 0.96 s: about 18 min with the load and the evals.
# make daemon-run ARGS="--queue --stall-timeout 900 scripts/pixel_head/train_x2.py --config <this file>"

output_name = "x2gf1k_1124_1256"
resume = "output/pixel_head/x2ovll_1124_0139/head_x2.safetensors"
x2flex = "post_image_dataset/x2flex/manifest_w32.json"
rollouts = 1000
lr = 2e-5
eval_every = 500
window = 32
overlap = true

dino = "facebook/dinov3-vits16-pretrain-lvd1689m"
