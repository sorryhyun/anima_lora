# turbo_1117_0823 (anchor alone, 14 of 28, v1.1 init, merged15, grad_accum 2, m15_k14of28_pall, one pass) at rank 96.
# The v1.1 delta is an r96 file, so the student starts from the whole delta instead of its r64 truncation (0.914 of
# the dW energy). alpha 220 keeps alpha / sqrt(rank) at 0823's 22.5, the sqrt(r) law the turbo config has followed
# at every rank (docs/anima/methods/adaln.md "Sizing"; docs/anima/findings/lora_recipe.md s34 / s41: at a fixed
# alpha / rank the dW step grows as sqrt(r) under Adam, and alpha ~ sqrt(r) matches it). adaln stays at 90 @ r16
# (22.5). The fake takes no update (anchor_only); its rank follows only to keep fake_rank >= student_rank.
# Read against turbo_1117_0823 EMA 6484 (fixed before the run), probe_handoff --anchor_k 14 --anchor_steps 28 on
# judge_hard seeds 1-4 (bench/turbo/results/20261117-0908-handoff_m15_0823_pall for the 0823 row):
#   - held-out anchor MSE below 0823's 0.070, toward 0.044 (the M0.25 level of the mix probe);
#   - S cos above 0823's 0.801; T>S@1 cos held at 0.94; sameness S near the teacher's 0.314 (0823: 0.300);
#   - renders: guitarist seed 2 and the group's lower half, where 0823 still breaks.
# A tie with 0823 says rank is not what limits the step-0 fit.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1117_0918"

iterations = 6484
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 96
student_alpha = 220
fake_rank = 96
fake_alpha = 220
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_pall"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 3242
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 3242
val_diversity_seeds = 8
val_prompt_idx = -1
