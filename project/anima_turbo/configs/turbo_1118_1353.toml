# Paired GAN, approximate R1 on the conv disc (plan.md item 2): turbo_1118_1302 with gan.r1_weight 0 -> 100
# (gan.r1_alpha 0.1 as before), nothing else changed (conv head on taps 13 / 20 / 27, disc_hidden 256,
# gan.paired_ratio 1.0, disc_lr 5e-5, 200-step delay, 200-step ramp, FM on block 27).
# The disc step adds 100 x mean((D(x_t) - D(x_t + 0.1 eta))^2), eta ~ N(0, I) on the teacher's sigma 0.75 state: one
# more no-grad teacher forward per iteration. Real and fake go in as before.
# Question: does R1 keep the conv disc from saturating, and does the GAN then read differently from 1302?
# Margin held near the token head's and the renders read better than 1302's -> R1 stays in the recipe and the ratio
# is read next. Margin still runs away -> a higher weight (1000 in the smoke below) or disc_lr 1e-5 (FastGen's).
# Records it rests on:
#   - 1302: disc margin 1.68 -> 11.15, disc loss 0.15 by the end (reports/paired_fm_gan.md).
#   - The user's call (2026-11-18): keep the disc from saturating; renoising to a higher tau is rejected, since the
#     disc would then tell noised states apart instead of what it should.
#   - Weight: 100 is FastGen's match of APT's strength at alpha 0.1 (its config comment: weight = lambda_apt x
#     sigma_apt / alpha^2 = 100 x 0.01 / 0.01) and the value docs/anima/methods/turbo.md gives for the loop's runaway.
#   - probe_gap_scale on 1302's step-1024 disc (16 pairs): R1 term 0.013 at alpha 0.1 (0.004 at 0.05, 0.103 at 0.2)
#     with teacher / student logits 0.96 / -6.09, so 100 x the term is 1.3 there.
#   - Smokes (60 it, no delay or ramp), disc margin at step 60: no R1 1.01, weight 100 0.92, weight 1000 0.70;
#     0.92 it/s with R1 against 0.97.
# Read: final EMA against turbo_1118_1302 EMA 2048 and turbo_1118_1122 EMA 2048, probe_handoff --anchor_k 14
# --anchor_steps 28 on judge_hard seeds 1-4, student sheets from bench/turbo/blind_sheets.py (one file per row).
# The user knows 1122's renders on sight, so the read against 1122 is labelled in effect; the user's read decides.
# Beside them, per step bin against 1302: disc margin, disc loss (it includes the R1 term here), training anchor MSE,
# FM loss, fm_grad_ratio; held-out anchor MSE, S cos, T>S@1 cos and sameness S from the probe.
# Bars: spread unknown (no seed twin of 1122 or 1302).
# Cost: 2048 iterations, about 48 min.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1118_1353"

iterations = 2048
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
fm_weight = 15.0
fm_block_idx = 27
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_p1024"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 1.0
paired_ratio = 1.0
feature_block_idx = 27
disc_lr = 5e-5
disc_hidden = 256
disc_head = "conv"
feature_blocks = [13, 20, 27]
delay_steps = 200
warmup_steps = 200
r1_weight = 100.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 1024
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 1024
val_diversity_seeds = 8
val_prompt_idx = -1
