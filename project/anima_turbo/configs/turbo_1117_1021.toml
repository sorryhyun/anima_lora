# LR A/B on a short run: the 0823 recipe (anchor alone, 14 of 28, v1.1 init, merged15, rank 64, grad_accum 2) on
# post_image_dataset/turbo_anchor_cache/m15_k14of28_p1024 (hardlinked subset of pall: the p512 keys plus 512 more,
# 1024 prompts x 2 eps = 2048 pairs). 2048 iterations = 1024 student updates, one pass.
# Arms: turbo_1117_1020 student_lr 5e-5 (control), turbo_1117_1021 student_lr 2e-5 (cosine to 2e-6). Nothing else differs.
# Read fixed before the run, final EMA of each, probe_handoff --anchor_k 14 --anchor_steps 28 on judge_hard seeds 1-4:
#   - held-out anchor MSE: 2e-5 below 5e-5 (0823 at 6484 pairs reads 0.070, 2209 at 1024 pairs 0.078);
#   - S cos up, T>S@1 cos held at 0.94, sameness S not down;
#   - renders: guitarist seed 2 and the group lower halves.
# 2e-5 wins if the probe and the renders favour it; then the full-cache run at 2e-5 follows.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1117_1021"

iterations = 2048
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 2e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_p1024"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 1024
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 1024
val_diversity_seeds = 8
val_prompt_idx = -1
