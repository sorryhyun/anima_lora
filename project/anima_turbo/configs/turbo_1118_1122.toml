# Paired GAN, generator dose (plan.md item 2): turbo_1118_1028 with gan.paired_ratio 0.5 -> 1.0, nothing else changed
# (1442 recipe + disc on block 27 of the FM forward, token head, disc_lr 5e-5, 200-step delay, 200-step ramp,
# weight_gen 1.0). rms(GAN grad) = rms(FM grad) on the teacher features every step.
# Question: does the doubled GAN gradient strengthen 1028's local-structure repair while the anchor fit holds?
# Holds and the renders improve -> 1.0 becomes the parent of the next arm. Anchor fit lost -> 0.5 stays and the next
# arm is on the disc side.
# Records it rests on:
#   - 1028 (ratio 0.5), steps 1600-2048: disc margin 3.05, training anchor MSE 0.0705 (1442: 0.0705), FM loss 0.0080,
#     gan_grad_share 0.43 (a GAN / FM gradient cosine near 0.10).
#   - 0953 (no normalisation, share 0.99, about 7x the FM gradient): disc margin 0.11, disc loss 1.36, training
#     anchor MSE 0.131, FM loss 0.0104. A low margin there came with a worse fit.
#   - The student gradient is clipped every iteration (pre-clip norm about 3 against grad_clip 1.0), so the update
#     size stays where 1028 has it and the anchor MSE's share of it falls.
# Read: final EMA against turbo_1118_1028 EMA 2048, probe_handoff --anchor_k 14 --anchor_steps 28 on judge_hard
# seeds 1-4, student sheets (guitarist seeds 1-4, group seeds 3 and 4, cafe text); the user's read decides.
# Beside them, per step bin against 1028: training anchor MSE (0.0879 at 400-800, 0.0705 at 1600-2048; 0953 ran
# 0.170 and 0.131), FM loss, disc margin, gan_grad_share; held-out anchor MSE from the probe.
# Cost: 2048 iterations, about 43 min.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1118_1122"

iterations = 2048
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
fm_weight = 15.0
fm_block_idx = 27
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_p1024"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 1.0
paired_ratio = 1.0
feature_block_idx = 27
disc_lr = 5e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 200
warmup_steps = 200
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 1024
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 1024
val_diversity_seeds = 8
val_prompt_idx = -1
