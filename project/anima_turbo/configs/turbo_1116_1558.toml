# Anchor alone from the v1.1 init: turbo_1116_1552 with dpdmd.anchor_only (no DM / CDM / GAN / fake update)
# and dm_first_step off; cdm.weight, gan.weight_gen and fake_warmup_steps at 0 as in S-b (1112_1044). Step 0 regresses on the anchor; steps 1-3 receive no loss and move only through
# the weights they share with step 0. The first arm of plan.md "Target: keep v1.1's steps 1-3, fit step 0".
# Start point, v1.1 untrained on merged15 (r96 file; the run starts from its r64 truncation, 0.914 of the
# ΔW energy): sameness S 0.396, S cos 0.677, T>S@1 cos 0.932, T>S@1 sameness 0.301, anchor MSE 0.138.
# Read, fixed before the run, on EMA 250:
#   - anchor MSE below 0.138 with T>S@1 cos and T>S@1 sameness at the start's level => the regression does
#     not reach steps 1-3; the recipe is this loop at length (anchor target cache);
#   - T>S@1 cos down => the anchor leaks into steps 1-3 through the shared weights, and the recipe needs a
#     term that holds them (plan.md, candidate 2);
#   - S cos and sameness S are read against the start's 0.677 / 0.396 and the cross cell's 0.742 / 0.318.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1116_1558"

iterations = 250
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 1
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 6
teacher_anchor_steps = 12
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 124
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 125
val_diversity_seeds = 8
val_prompt_idx = -1
