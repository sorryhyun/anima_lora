# Candidate 4 (plan.md) with a teacher-forced handoff: DM / CDM / GAN on steps 1-3 only, rolled from the anchor
# target's step 0 (dpdmd.teacher_handoff: x_1 = eps - 0.1*v_target from the p512 cache) instead of the student's own
# step 0. Student warm-started from turbo_1116_2209 EMA 1024 (step 0 fit on the same cache); step 0 keeps the cached
# anchor (div_weight 0.1). Fake from the v1.1 delta with a 200-update head-start; term weights from 1552
# (cdm cond 1.0, gan 0.03). 250 iterations, the A/B length.
# Read against turbo_1116_2209 EMA 1024, untrained (fixed before the run):
#   - renders (judge_hard, 4 steps, cfg 1): the finish at the places 2209 breaks (ba5 lower half seeds 1-2,
#     bocchi guitar / mic seeds 1 and 4, cafe aprons) gets cleaner, with each seed's layout kept from 2209;
#   - a layout that moves away from 2209 / the teacher, or one layout across seeds, means DM reached step 0
#     through the shared weights;
#   - train anchor MSE on the cache stays near 2209's ~0.06.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1116_2221"

iterations = 250
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "output/ckpt/turbo_1116_2209/turbo_1116_2209_1024_ema.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 1.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 200
grad_accum = 1
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = false
teacher_handoff = true
rollout_grad = false
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_p512"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.03
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 125
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 125
val_diversity_seeds = 8
val_prompt_idx = -1
