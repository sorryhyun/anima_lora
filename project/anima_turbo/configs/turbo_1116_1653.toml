# Anchor alone at 1k: turbo_1116_1558 (v1.1 delta init, dpdmd.anchor_only, no DM / CDM / GAN / fake
# update) at 1000 iterations, cosine over the 1000, saves every 250. plan.md candidate 2. About 33 min.
# The cosine spans the whole run, so this run's 250 / 500 / 750 saves sit at a higher LR than 1558's
# EMA 250 and are not its twins; the read is on EMA 1k.
# Reference rows on merged15 (reports/v11_init.md): 1558 EMA 250 sameness S 0.350, S cos 0.766,
# T>S@1 cos 0.946, T>S@1 sameness 0.308, anchor MSE 0.082 (group / cafe / guitarist 0.060 / 0.070 /
# 0.115); start (v1.1 untrained) 0.396 / 0.677 / 0.932 / 0.301 / 0.138; Hub v3 anchor MSE 0.062
# (0.060 / 0.078 / 0.049); teacher sameness 0.315.
# Read, fixed before the run, on EMA 1k against 1558 EMA 250:
#   - length pays if anchor MSE, S cos and sameness S all move past 1558's with T>S@1 cos not below
#     the start's 0.932. No size threshold.
#   - T>S@1 cos below 0.932 => the anchor leaks into steps 1-3 at length (plan.md candidate 5).
#   - The finish is read on the renders, where 1558 breaks: the lower half of the group on seeds
#     1 / 2 / 4, the guitarist's hand on seed 1 (probe grid), the guitar body on judge seed 2. Whole
#     there => a better-fitted step 0 finishes by itself. Broken there with the anchor MSE down =>
#     the MSE does not measure the finish and length is not the fix (the group is already at Hub v3's
#     MSE in 1558 and breaks).
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1116_1653"

iterations = 1000
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 1
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 6
teacher_anchor_steps = 12
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 250
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 250
val_diversity_seeds = 8
val_prompt_idx = -1
