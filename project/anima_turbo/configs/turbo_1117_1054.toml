# turbo_1117_0823 at student_lr 2e-5 (cosine to 2e-6): the full-dataset anchor cache (m15_k14of28_pall, 6484
# pairs, one pass), rank 64, grad_accum 2. Only the LR differs from 0823.
# Why: the short A/B (turbo_1117_1020 / 1021) did not pass on the probe, but the user's read of its renders
# (2026-11-17) sees promise in 2e-5; this run settles it at the full length before the LR is closed.
# Read fixed before the run, final EMA against turbo_1117_0823 EMA 6484, probe_handoff --anchor_k 14
# --anchor_steps 28 on judge_hard seeds 1-4:
#   - held-out anchor MSE below 0.070; S cos not below 0.801; T>S@1 cos held at 0.94; sameness S (0.300) not down;
#   - renders, the user's read: guitarist seed 2 and the group's lower halves, where 0823 breaks.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1117_1054"

iterations = 6484
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 2e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_pall"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 3242
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 3242
val_diversity_seeds = 8
val_prompt_idx = -1
