# Paired feature matching (plan.md arm 2) on the 1020 short run: 0823 recipe, rank 64, student_lr 5e-5,
# m15_k14of28_p1024 (2048 pairs), 2048 iterations, grad_accum 2. Only dpdmd.fm_weight 0.01 (tap: middle block,
# sigma_k 0.75) differs from turbo_1117_1020. At 0.01 the feature gradient into v is near the anchor MSE's
# (64-iteration smoke at 1.0: 52-270x); floor below 1e-5 (reports/step0_depth.md, "Feature matching").
# Read fixed before the run, final EMA against turbo_1117_1020 EMA 2048, probe_handoff --anchor_k 14
# --anchor_steps 28 on judge_hard seeds 1-4:
#   - S cos up from 0.785, T>S@1 cos held at 0.94, sameness S not down from 0.285;
#   - held-out anchor MSE not above 0.074 by more than the A/B spread (0.002): the feature term may trade a
#     little MSE for the part steps 1-3 read;
#   - renders: guitarist seeds 1, 2 and 4 and the group lower halves, where 1020 breaks.
# Passes if the probe and the renders favour it.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1117_1105"

iterations = 2048
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
fm_weight = 0.01
fm_block_idx = -1
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_p1024"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 1024
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 1024
val_diversity_seeds = 8
val_prompt_idx = -1
