# Anchor alone on the teacher's 28-step schedule: turbo_1116_1558 with dpdmd.k_anchor 14 / teacher_anchor_steps 28
# (the 28-step chord to sigma 0.75; 1558 trained on 6 of 12). plan.md "What is open" 1, anchor_only_recipe.md.
# The target itself as step 0 (A>S@1 on 1653's steps 1-3) reads cos 0.967 / sameness 0.249 on 14 of 28 against
# 0.818 / 0.346 on 6 of 12; 1653 EMA 1k sits at MSE 0.084 to the 14 of 28 target.
# Probe with --anchor_k 14 --anchor_steps 28 (anchor MSE is against this target, not 1558's).
# Read, fixed before the run, on EMA 250 against 1558 EMA 250 (sameness 0.350, S cos 0.766, T>S@1 cos 0.946):
#   - S cos past 0.766 (and past 1653's 0.775) with sameness at or below 0.350, toward the teacher's 0.315
#     => the 28-step target is the recipe; the 1k run follows;
#   - T>S@1 cos held at 0.94+ => steps 1-3 untouched as on the 6 of 12 target;
#   - renders at the places the 6 of 12 runs break (group lower half seeds 1-2, guitarist seeds 1 and 4,
#     cafe apron colour) decide the finish question.
# Cost estimate: 29 teacher forwards an iteration, about 3.6 s, about 16 min.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1116_1810"

iterations = 250
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 1
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 124
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 125
val_diversity_seeds = 8
val_prompt_idx = -1
