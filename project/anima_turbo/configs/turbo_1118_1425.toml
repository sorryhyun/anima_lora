# Paired GAN at a low LR on the full cache: turbo_1118_1353 (conv disc, taps 13 / 20 / 27, R1 100, paired_ratio 1.0)
# with student_lr 5e-5 -> 2e-5 and gan.disc_lr 5e-5 -> 2e-5, anchor cache m15_k14of28_p1024 -> m15_k14of28_pall
# (6484 pairs, one pass, 6484 iterations). Everything else as 1353.
# Why: the user's call (2026-11-18), queued before 1353's read; stopped if that read comes out wrong.
# Records it rests on:
#   - turbo_1117_1054 (0823 at student_lr 2e-5, full cache, no GAN): held-out anchor MSE 0.0674 against 0823's 0.0695,
#     S cos 0.792 / 0.801, sameness 0.284 / 0.300; the user's read of its renders still open (reports/step0_depth.md).
#   - fake_lr is idle under anchor_only (no fake loop), so student and disc are the two LRs that act here.
#   - 1353 at step 1024-1280: disc margin flat near 5.2, disc loss 0.44-0.49 (1302 without R1: 9.5-10.2, 0.19-0.21).
# Read: final EMA against turbo_1117_1054 EMA 6484 (same LR and cache, no GAN), probe_handoff --anchor_k 14
# --anchor_steps 28 on judge_hard seeds 1-4, student sheets from bench/turbo/blind_sheets.py (one file per row);
# beside them the disc margin and disc loss per step bin. Checkpoints every 1024 steps for an early look.
# Cost: 6484 iterations at about 0.93 it/s with the GAN, about 2 h.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1118_1425"

iterations = 6484
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 2e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
fm_weight = 15.0
fm_block_idx = 27
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_pall"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 1.0
paired_ratio = 1.0
feature_block_idx = 27
disc_lr = 2e-5
disc_hidden = 256
disc_head = "conv"
feature_blocks = [13, 20, 27]
delay_steps = 200
warmup_steps = 200
r1_weight = 100.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 1024
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 3242
val_diversity_seeds = 8
val_prompt_idx = -1
