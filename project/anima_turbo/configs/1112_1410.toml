# S-b long, annealed tail (1112_1410): 1112_1336 resumed from its bundle (step 750) to 1000 with
# lr_schedule cosine, so the last 250 iterations run at about 1.2e-5 falling to 5e-6 instead of 5e-5.
# Launch with --resume output/ckpt/1112_1336/1112_1336_resume.pt. Nothing else changes.
# 1112_1336 on the constant LR: held-out anchor MSE of the EMA 0.165 / 0.143 / 0.155 / 0.140 at
# 250 / 500 / 750 / 1k, and P>S@1 0.481 / 0.576, the level of S-c.2. The two 500-iteration students
# at 0.118 / 0.109 ran on the cosine. Asks whether the anneal is what separates them.
# Read, fixed before the run: held-out anchor MSE of the raw and EMA final against 1112_1336's
# 1k (0.140) and the cosine students' 0.118 / 0.109, and P>S@1 against 0.481 / 0.576.
dit_path = "models/diffusion_models/anima_merged14_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged14.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "1112_1410"

iterations = 1000
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "weight_svd"
fake_down_init = "weight_svd"
student_init_weights = ""
fake_init_weights = ""
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = true
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 1
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.05

[dpdmd]
k_anchor = 6
teacher_anchor_steps = 12
div_weight = 0.1
detach_after_first = true
dm_first_step = false
rollout_grad = false
anchor_only = true

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.0
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 250
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 250
val_diversity_seeds = 8
val_prompt_idx = -1
