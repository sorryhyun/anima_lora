# v1.1 delta init on merged15: turbo_1116_0958 (shipped recipe, 250 it, static grid, cond-only L_CDM) with
# the student and the fake both seeded from the official turbo v1.1 delta, as Hub v3's own run seeded them
# (kaiming downs, r96 file SVD-truncated to r64). The 200-step fake warmup is kept. Nothing else changes.
# Start point, v1.1 untrained on merged15 (bench/turbo/results/20261116-1550-handoff_m15_v11_untrained/):
# sameness S 0.396, S cos 0.677, T>S@1 cos 0.932, anchor MSE 0.138. Hub v3 untrained: 0.296 / 0.635 /
# 0.805 / 0.062. 0958 (cold, this recipe): 0.442 / 0.608 / 0.841 / 0.138. m15 teacher sameness 0.315.
# Read, fixed before the run, on EMA 250 with the renders beside it:
#   - the init helps => ahead of 0958 on all four numbers and in the renders;
#   - training helps => ahead of its own start: sameness below 0.396 and anchor MSE below 0.138 with
#     S cos and T>S@1 cos not below the start's;
#   - sameness up toward 0958's 0.442 and T>S@1 cos down toward 0.84 => the recipe pulls a third start
#     to the same place, and the DM terms on steps 1-3 are what to change, not the init.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1116_1552"

iterations = 250
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 1.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 200
grad_accum = 1
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 6
teacher_anchor_steps = 12
div_weight = 0.1
detach_after_first = true
dm_first_step = true
rollout_grad = false

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.03
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 124
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 125
val_diversity_seeds = 8
val_prompt_idx = -1
