# Paired GAN (plan.md arm 3) on top of turbo_1117_1442 (FM tap 27 at 15, renders read as fine by the user 2026-11-18),
# nothing else changed (0823 recipe, rank 64, student_lr 5e-5, m15_k14of28_p1024, 2048 iterations, grad_accum 2,
# sigma_k 0.75). The disc (token head) reads the teacher's block-27 features of the anchor end state from the FM
# forward: real = x_t = eps - 0.25 v_target, fake = x_s = eps - 0.25 v_student; no extra teacher forward.
# smoke_pgan (80 it, weight_gen 1.0, disc_lr 1e-5): GAN share of the feature-path gradient 0.88-0.93 (about 2x FM),
# disc margin only 0.05 at step 80. So weight_gen 0.5 (GAN about level with FM), disc_lr 5e-5, generator held at 0
# for 200 steps while the disc trains, then a 200-step ramp. No renoise augmentation (1024 prompts x 2 cached draws,
# one draw per epoch: 2048 distinct reals, each seen once).
# Read: final EMA against turbo_1117_1442 EMA 2048 on the renders (guitarist seeds 1, 2 and 4, the group lower
# halves); the user's read decides. Log numbers (anchor MSE, disc margin, gan_grad_share) go beside them.
dit_path = "models/diffusion_models/anima_merged15_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima_merged15.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"
output_name = "turbo_1118_0953"

iterations = 2048
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "kaiming"
fake_down_init = "kaiming"
student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_transition = true

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = false
dm_x0_norm = true
norm_floor = 0.05
dm_draws = 1

[cdm]
weight = 0.0
grad_ckpt = true
teacher = "cond"

[mfd]
dtau = 0.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 0
grad_accum = 2
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 14
teacher_anchor_steps = 28
div_weight = 0.1
detach_after_first = true
dm_first_step = false
anchor_only = true
rollout_grad = false
fm_weight = 15.0
fm_block_idx = 27
anchor_cache = "post_image_dataset/turbo_anchor_cache/m15_k14of28_p1024"

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.5
feature_block_idx = 27
disc_lr = 5e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 200
warmup_steps = 200
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[io]
save_every = 1024
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 1024
val_diversity_seeds = 8
val_prompt_idx = -1
