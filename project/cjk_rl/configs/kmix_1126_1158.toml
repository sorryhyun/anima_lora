#   や 11 → 5, ヒ 7 → 0. ヒ comes from g2a's 4-step save (10 at 4 steps, 7 at 6).
# What it is for: the kanji run's [start_shift] (run = this handle, save = "mix": the mean
#   displacement of these 164 rows from jp_v1's rows), and the kana rows to bake.
# Output: output/cjk_rl/g1/kmix_1126_1158/rows_mix.pt, sources.json (local).

