# Kana mix: g2b_1126_0058's 16-step rows with ten rows taken from g2a_1125_1642 (the user,
#   11-26: "g2a는 잘했는데 g2b가 못했던거 몇개 갖고와서 g2b + alpha 로 초기 잡으면 좋을듯", then on
#   the ten blind sheets "다 그대로 가져와도 되겠다", "히는 4스텝"). No arm, no gate: a data build
#   (probes/rows_mix.py, CPU).
# The ten are the rows where g2b's 16-step solo is under g2a's 6-step solo by 5 or more of
#   16 under both readers (reports/g2b_2026_11_26.md; g2a → g2b under the tuned reader):
