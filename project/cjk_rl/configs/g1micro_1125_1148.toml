# G1 micro arm (plan.md item 2): the 16 rows of seed_1008 trained on the reader's loss through
#   the last step of G-D's path (src/g1.py; m15v11, 4 Euler steps, cfg 1, shift 3, 768²,
#   pixel-head decode, bubble frame). No parent: the path's first training run.
# Loss a render: the reader's cross-entropy of the glyph on the picked crop; on a page with no
#   box, −log of the detector's top score. No page term (the user's go on Claude's proposal,
#   11-25: at weight 1 it is 5 500 times under ce, reports/gd_g0d_2026_11_25.md).
# Update: a render's row gradient clipped to `clip`, a row's mean over `accum` renders into a
#   momentum, the row moved `eta` row norms against the momentum's direction. This replaces
#   the plan's "one optimizer step a pass at lr 2e-4": two Adam steps at 2e-4 move a row at
#   most 1.3 % of its norm, which would repeat P1's "the rows barely moved". Here a row takes
#   8 steps of 0.03: between 0.08 (no shared direction) and 0.24 (one direction) row norms;
#   jp_v1's rows sit a median of 1.0 row norms from the pack rows.
# Question: do rows moved along the averaged reader gradient read their glyph more often on
#   scenes no update saw?
#   - solo up over the glyphs, the null and extra not up -> the permuted-label control at this
#     length, then the longer run.
#   - level -> the log decides what changes: cos_prev (a row's successive mean gradients)
#     near 0 -> 16 renders carry no direction, accum goes up; cos_prev clearly over 0 with the
#     reads level -> more passes or a larger eta.
#   - solo down or extra up -> the rows were pushed off; eta goes down.
# Records it rests on:
#   - reports/gd_g0d_2026_11_25.md (g0d_1125_1119): the last step's ce gradient on a missed
#     render has norm 0.013 / 0.12 / 0.87 (10th percentile / median / 90th), which sets `clip`
#     at the median; two renders of a glyph share a label direction at cosine 0.025, the whole
#     ce gradient at 0.009.
#   - reports/glyph_scenes_2026_11_25.md: the read scenes are the crossed grid's four; solo out
#     of 16 there on the start rows (WebP reads): ひ 11, あ 8, ぬ 7, う 5, さ 4, が 2, め 1,
#     を 1, 死 7, 王 4, 太 3, 二 3, 味 2, 楽 1, 人 0, 行 0.
# Split: by folder; no read scene's artist folder is on the training side (asserted).
# Read: the 16 glyphs × read scenes × seeds 0-3 on the start rows and the trained rows, same
#   process and read path: solo / on_page / extra a glyph, the next glyph's solo on the same
#   pages (the null), the reader's ce on the picked crop, paired over the glyphs with a sign
#   test; the log's cos_prev and drift. Sheets a glyph, the two arms as rows A / B in an order
#   drawn per glyph (sheets/key.json), to the user, whose read decides. The rows' neighbours
#   are not rendered: no other row is trained and a caption holds one row.
# Bars: spread unknown (no twin; the permuted-label control is not in this run). Two reads of
#   one picture put 26 of 128 pages in another case (the G0d report).
# Cost: 512 groups at about 2.6 s, 22 min; the read 512 renders, about 4 min.

rows = "seed_1008"
hira = "ひあぬうさがめを"
kanji = "死王太二味楽人行"
frame = "bubble"
train_scenes = [0, 3, 96, 13, 36, 68, 87, 106, 18, 41, 24, 117, 25, 63, 78, 118]  # ids in assets/glyph_scenes.json
read_scenes = [6, 12, 45, 15]
passes = 2
train_seed0 = 1000  # pass p: train_seed0 + 4p … + 3
read_seeds = [0, 1, 2, 3]
shuffle_seed = 1125
conf_min = 0.6
clip = 0.12   # a render's row-gradient norm, effective units
accum = 16    # renders a row step
eta = 0.03    # row norms a step
beta = 0.7    # momentum over a row's steps
