# stage0305 — the small-text band (design.md § 2): 12–24 px text — sentences
# at scene_min_glyph 16, small-bubble dialogue, small grid strings.
# Warm from stage0507 (same tag). Nothing has been read under σ 0.25.

stage = "stage0305"
band = [0.3, 0.5]
gate = "contain"
min_overlap = 0.8
warm_from = "stage0507"

[data]
scenes = "s1,s1w,sl1w,ja_comic"
scene_one_bubble = "ja_comic"
single_scenes = "s1,s1w"
horizontal_scenes = "sl1w"                  # left-to-right scene items go to the EN-sentence pool only (user, 2026-09-24)
single_max_ar = 2.0
shapes = "448,512:2,448x512,512x448"
horizontal_frac = 0.3                       # multi-glyph items (scene) / cells (grid) drawn as left-to-right lines, marked in the caption; a single glyph has no orientation
short_pieces = "2-5"
sentence_min_letters = 6

[[data.mix]]                                # dialogue at 14–22 px, up to two columns
recipe = "scene_sentence"
share = 0.4
glyph_px = [14, 22]                         # sets the fill per item (a bare min_glyph floor draws 23 px)
min_glyph = 12
fill = 0.9
max_lines = 2
px_target = 18

[[data.mix]]                                # one piece per bubble at 12–24 px (the piece/multi 12–24 px row; a piece has no read at this px — by design)
recipe = "scene_piece"
share = 0.3
glyph_px = [12, 24]
min_glyph = 12
fill = 0.9
fill_min = 0.5                              # only scenes whose bubble the text fills ≥ half — small text in small bubbles, not floating in a big one
px_target = 18

[[data.mix]]                                # the A.2 cell: strings in word cells at 12–24 px
recipe = "grid_string"
share = 0.3
grids = "2x2,2x3,3x2"
glyph_px = [12, 24]
source = "both"
max_glyphs = 8
bubble_frac = 0.5

[train]
batch = 4
lr_rows = 1e-3
lr_decay = "cosine"
lr_warmup_ratio = 0.1                       # of the stage's steps (micro_warm_0923: 100 / 640, 200 / 1280; the former 500 was 0.007 of 70 k)
init_anchor = 0.1                           # μ to the previous stage (user, 2026-09-24: 0.01 let stage0507 undo 0709's singles 27 → 20 / 32 — micro_chain_result.md § 3)
box_share = 0.25                            # single glyph's in-box share; log up to …
box_share_cap = 0.5                         # … the cap, at …
box_share_glyphs = 8                        # … this many glyphs (loss.py)
compile = 1
save_every = 5000

[eval]
groups = "single,single_ext,single_small,single_kanji,single_extra,word,short,short_held,phrase,phrase_held,en"
native_chars = "あ,か,す,日"
native_clauses = "en,swap"
seeds = 2
cf_sense = true
cf_rows = "piece"
regress = ["stage0709", "stage0507"]
