# joint0507_0305 — the piece bands' data (stage0507 + stage0305) in one run,
# σ per item from its stage's band (cjk_scale/joint.py). Built for the freeze
# arm (reports/conflict_joint_2026_09_25.md § 4 / § 6, next.md A-F): the run
# names the pieces as its inventory with `context = "seed"`, so every single
# rides frozen at the seed and stage0709's single data has nothing to train —
# 0 / 45 / 45. stage0507's single recipes drop under such a run
# (recipes.missing_source, shares renormalised — build.json `dropped`).
# Otherwise joint.toml.

stage = "joint0507_0305"
band = [0.3, 0.7]                           # the envelope the items' bands lie in (log / cf_sense); not a draw band
gate = "none"
warm_from = ""                              # the run's seed_table
joint_from = ["stage0507", "stage0305"]

[train]
batch = 4
lr_rows = 1e-3                              # the lr that moved pieces (micro_warm_0923; conflict report § 3)
lr_decay = "cosine"
lr_warmup_ratio = 0.1
init_anchor = 0.0                           # no spring: the singles are frozen, the pieces need the displacement (report § 4 verdict 3)
box_share = 0.25
box_share_cap = 0.5
box_share_glyphs = 8
grid_box = 1                                # grid cells' union as the loss box (loss.py; grid_box report)
compile = 1
save_every = 5000

[eval]
groups = "word,en"                          # no single group: a pieces-only inventory has none
native_chars = "あ,い"                      # frozen context rows — a same-as-seed control
native_clauses = "en,swap"
seeds = 2
cf_sense = false
cf_rows = "piece"
regress = []
