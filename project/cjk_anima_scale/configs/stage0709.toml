# stage0709 — the glyph-identity band (design.md § 2): single glyphs ≥ 48 px
# — scene bubble fit (48–53 px), grid cells (85–200 px), large flat singles.
# First stage of the chain: warms from the run file's seed_table.

stage = "stage0709"
band = [0.7, 0.9]
gate = "contain"
min_overlap = 0.8
warm_from = ""                              # the first stage: the run's seed_table

[data]
scenes = "s1,s1w,sl1w,ja_comic"
scene_one_bubble = "ja_comic"
single_scenes = "s1,s1w"
single_max_ar = 2.0
shapes = "448,512:2,448x512,512x448"
horizontal_frac = 0.3                       # multi-glyph items (scene) / cells (grid) drawn as left-to-right lines, marked in the caption; a single glyph has no orientation

[[data.mix]]                                # step 1a's scene half: bubble fit, 48–53 px as built
recipe = "scene_single"
share = 0.5
fill = 0.7
min_glyph = 28
px_target = 50

[[data.mix]]                                # step 1a's grid half + the flat single (1×1)
recipe = "grid_single"
share = 0.5
grids = "1x1:1,2x2:1,3x3:1,2x3:1,3x2:1"
fill = [0.3, 0.8]                           # one draw per item, × cell short side: 3×3 → 51–136 px, 1×1 → 150–400
bubble_frac = 0.5
mark_horizontal = true

[train]
batch = 4
lr_rows = 1e-3
lr_decay = "cosine"
lr_warmup_ratio = 0.1                       # of the stage's steps (micro_warm_0923: 100 / 640, 200 / 1280; the former 500 was 0.007 of 70 k)
init_anchor = 0.1                           # μ on the warm rows (user, 2026-09-24: step 2's μ; 0.0 / 0.01 let stage0507 undo 0709's singles — micro_chain_result.md § 3)
box_share = 0.25                            # single glyph's in-box share; log up to …
box_share_cap = 0.5                         # … the cap, at …
box_share_glyphs = 8                        # … this many glyphs (loss.py)
compile = 1
save_every = 5000

[eval]
groups = "single,single_ext,single_small,single_kanji,single_extra,en"
native_chars = "あ,か,す,日"
native_clauses = "en,swap"
seeds = 2
cf_sense = true
cf_rows = "single"
regress = []
