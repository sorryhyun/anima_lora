# run0924_micro_ctx — run0923_micro's 24 rows with the seed table as context:
# every other row rides frozen at its seed value (training and eval), so
# stage0309 can train the 24 rows inside real dialogue lines. Launched on the
# μ 0.1 micro chains' tags (`--tag run0923_micro_b30` / `run0923_micro_b0045`),
# whose stage0305 tables are the warm start and the baseline.

run = "run0924_micro_ctx"
seed_table = "output/cjk_anima_scale/rows_step1_0921_merged/trained.pt"
seed = 0
context = "seed"

[data]
units = ["chars:あいおなアナラル人日口女精聞動願", "list:それを,はじ,やはり,すご,メン,アン,プロ,ファ"]
pieces = ""
phrase_file = "$MANGA109S/derived/dialogue_2_10.tsv"   # lines with ≥ 1 inventory piece, the rest context rows
n_items = 5000                              # ≥ 25 rows × 50 × batch 4

[budget]
stage0309 = 50

[eval]
groups = "single,word,en"
native_chars = "あ,い,日,願"
sent_strings = "はい,おしい,やったネ,ちょっと来い"
target = true
