# stage0309 — the consolidation pass (design.md § 2): sentences and pieces at
# natural sizes over the whole live range; the sentence run's role, with a
# low anchor so the rows compose without leaving where the band stages put
# them. No band gate. Whether this is accumulate or a merge of per-band
# tables is band_experiment_results.md § 6 item 1 (unread).

stage = "stage0309"
band = [0.3, 0.9]
gate = "none"
warm_from = "stage0305"

[data]
scenes = "s1,s1w,sl1w,ja_comic"
scene_one_bubble = "ja_comic"
single_scenes = "s1,s1w"
horizontal_scenes = "sl1w"                  # left-to-right scene items go to the EN-sentence pool only (user, 2026-09-24)
single_max_ar = 2.0
shapes = "448,512:2,448x512,512x448"
horizontal_frac = 0.3                       # multi-glyph items (scene) / cells (grid) drawn as left-to-right lines, marked in the caption; a single glyph has no orientation
short_pieces = "2-5"
sentence_min_letters = 6

[[data.mix]]                                # sentences + pieces only (user, 2026-09-24): no single / grid / short draws here
recipe = "scene_sentence"
share = 0.7
min_glyph = [16, 28]
fill = 0.9
max_lines = 2

[[data.mix]]
recipe = "scene_piece"
share = 0.3
fill = [0.7, 1.0]
min_glyph = 28

[train]
batch = 4
lr_rows = 1e-3
lr_decay = "cosine"
lr_warmup_ratio = 0.1                       # of the stage's steps (micro_warm_0923: 100 / 640, 200 / 1280; the former 500 was 0.007 of 70 k)
init_anchor = 0.1                           # step 2's μ (warm_cos 0.996 at 30 k)
box_share = 0.05                            # step 2's values; log up to the cap at box_share_glyphs
box_share_cap = 0.25
box_share_glyphs = 8
grid_box = 1                                # grid cells' union as the loss box (loss.py; user, 2026-09-25: joint j90 μ0 gbox vs plain — single 26 vs 24, native 36/29 vs 33/23, pieces +15 % drift, en held; 0 = the plain-MSE grid of every arm before)
compile = 1
save_every = 5000

[eval]
groups = "single,single_ext,single_small,single_kanji,single_extra,word,short,short_held,phrase,phrase_held,en"
native_chars = "あ,か,す,日"
native_clauses = "en,swap"
seeds = 2
cf_sense = true
cf_rows = "single"
regress = ["stage0709", "stage0507", "stage0305"]
sent_strings = "はい,おしい,やったネ,ちょっと来い"   # multi-glyph native (the probe's `--eval_tag sent`), en clause
target = true                               # the user's verbatim captions (はい / こんにちは)
