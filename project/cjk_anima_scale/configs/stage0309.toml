# stage0309 — the consolidation pass (design.md § 2): everything, mixed, at
# natural sizes over the whole live range; the sentence run's role, with a
# low anchor so the rows compose without leaving where the band stages put
# them. No band gate. Whether this is accumulate or a merge of per-band
# tables is band_experiment_results.md § 6 item 1 (unread).

stage = "stage0309"
band = [0.3, 0.9]
gate = "none"
warm_from = "stage0305"

[data]
seed = 0
n_items = 40000
units = ["kana", "kana_ext*1", "small", "kanji:200*1", "list:、,。,・,ー,～,〜,！,？,「,」,！！,・・・,・・・・*1"]
pieces = "ja_cold_0001_1900.txt"
scenes = "s1,s1w,sl1w,ja_comic"
scene_one_bubble = "ja_comic"
single_scenes = "s1,s1w"
single_max_ar = 2.0
shapes = "448,512:2,448x512,512x448"
phrase_file = "$MANGA109S/derived/dialogue_2_10.tsv"
short_pieces = "2-5"
sentence_min_letters = 6

[[data.mix]]
recipe = "scene_single"
share = 0.1
fill = 0.7
min_glyph = 28

[[data.mix]]
recipe = "grid_single"
share = 0.1
grids = "1x1:1,2x2:1,3x3:1,2x3:1,3x2:1"
fill = [0.15, 0.8]

[[data.mix]]
recipe = "scene_piece"
share = 0.2
fill = [0.7, 1.0]
min_glyph = 28

[[data.mix]]
recipe = "scene_short"
share = 0.3
min_glyph = 28
fill = 0.7

[[data.mix]]
recipe = "scene_sentence"
share = 0.3
min_glyph = [16, 28]
fill = 0.9
max_lines = 2

[train]
steps_per_row = 30                          # "to set" (design § 5) — the first run reads it
batch = 4
lr_rows = 1e-3
lr_decay = "cosine"
lr_warmup = 500
init_anchor = 0.1                           # step 2's μ (warm_cos 0.996 at 30 k)
box_share = 0.05
box_share_cap = 0.25
compile = 1
seed = 0
save_every = 5000

[eval]
groups = "single,single_ext,single_small,single_kanji,single_extra,word,short,short_held,phrase,phrase_held,en"
native_chars = "あ,か,す,日"
native_clauses = "en,swap"
seeds = 2
cf_sense = true
cf_rows = "single"
regress = ["stage0709", "stage0507", "stage0305"]
