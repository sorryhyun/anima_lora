# stage0309 — the consolidation pass (design.md § 2): sentences and pieces at
# natural sizes over the whole live range; the sentence run's role, with a
# low anchor so the rows compose without leaving where the band stages put
# them. No band gate. Whether this is accumulate or a merge of per-band
# tables is band_experiment_results.md § 6 item 1 (unread).

# (trainer half of the pre-collapse stage file; split 2026-09-25 —
# data recipe: configs/data_build/stage0309.toml)

warm_from = "stage0305"

batch = 4
lr_rows = 1e-3
lr_decay = "cosine"
lr_warmup_ratio = 0.1                       # of the stage's steps (micro_warm_0923: 100 / 640, 200 / 1280; the former 500 was 0.007 of 70 k)
init_anchor = 0.1                           # step 2's μ (warm_cos 0.996 at 30 k)
box_share = 0.05                            # step 2's values; log up to the cap at box_share_glyphs
box_share_cap = 0.25
box_share_glyphs = 8
grid_box = 1                                # grid cells' union as the loss box (loss.py; user, 2026-09-25: joint j90 μ0 gbox vs plain — single 26 vs 24, native 36/29 vs 33/23, pieces +15 % drift, en held; 0 = the plain-MSE grid of every arm before)
compile = 1
save_every = 5000
