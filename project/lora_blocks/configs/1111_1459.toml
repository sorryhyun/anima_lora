# Aligned + kv twin of c_fill_s400 (C v1): the same request with ref_adapters = "kv" only
# (reference stream on Base, no backward; k/v export adapters, ref_rank 32). Asks whether kv
# alone slows the copy: the ~1,200-step break at lr 5e-5 was measured on offset + kv only.
# Compare loss at matched steps against c_fill_s400.json, and the copy probe on s100–s400.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/1111_1459.toml"

cache = "post_image_dataset/moss/c_fill_illu"
output = "output/ckpt_moss_i2i/1111_1459.safetensors"
max_steps = 400
save_every_steps = 100
ema_window = 0.0
caption_dropout = 1.0
ref_timestep = 0.0
ref_isolate = true
ref_adapters = "kv"
ref_gate = "cut"
gate_holes = "post_image_dataset/moss/c_fill_illu/hole_layouts.json"
gate_rate = 0.9
tone_weight = 0.0
int8 = "stream"
stream = "fp32"
blocks_to_swap = 38
activation_memory_budget = 0.1
swap_h2d_only = true
fit_report = true
