# sanitize_ft_cbw10_s300 from the offset copy block: init c_fill_bw10_mod16_off_kv_lr2e4_s4800
# (C bw10 mod16 at ref_pos offset, ref_adapters kv, Muon lr 2e-4, 4,800 steps). The fine-tune keeps
# offset + kv (the init's export adapters only exist under kv). Otherwise P2's recipe: 277 pairs,
# lr 5e-5, rank 32, EMA off, tone 0.003 from half-way, no gate. Against cbw10-ft / v3 in
# reports/p2_sanitize_ft.md and reports/c_fill_mod16_bw10.md.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/sanitize_ft_off_kv_s300.toml"

cache = "post_image_dataset/moss/i2i_sanitize_idt"
output = "output/ckpt_moss_i2i/sanitize_ft_off_kv_s300.safetensors"
init_lora = "output/ckpt_moss_i2i/c_fill_bw10_mod16_off_kv_lr2e4_s4800.safetensors"
max_steps = 300
save_every_steps = 100
ema_window = 0.0
ref_timestep = 0.0
ref_isolate = true
ref_pos = "offset"
ref_adapters = "kv"
tone_weight = 0.003
tone_start = 0.5
mod_rank = 16
int8 = "stream"
stream = "fp32"
# the kv C plan (peak 13.2 GB with ref_gate cut on the c_fill cache)
blocks_to_swap = 34
activation_memory_budget = 0.05
swap_h2d_only = true
fit_report = true
