# sanitize, full run on the kv copy block: the shipped v3 recipe (moss_i2i_sanitize_idt_w0003_late_lr5e5_e8:
# 277 pairs, 8 epochs, muon lr 5e-5, ema_window 0.1) with ref_adapters = "kv", init from the kv copy
# block 1111_1546 (mod16 carried from it), int8 stream / fp32, and no tone term (v3 had 0.003 from 0.5).
# Swap 36 / budget 0.15 (the 300-step kv fine-tune 1111_1631 ran 34 / 0.05 at 12.3 GB peak);
# fit_report trains the largest sample first, so an OOM shows at step 1.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/1112_0047.toml"

cache = "post_image_dataset/moss/i2i_sanitize_idt"
output = "output/ckpt_moss_i2i/1112_0047.safetensors"
init_lora = "output/ckpt_moss_i2i/1111_1546.safetensors"
epochs = 8
save_every_epochs = 4
ref_timestep = 0.0
ref_isolate = true
ref_adapters = "kv"
mod_rank = 16
tone_weight = 0.0
int8 = "stream"
stream = "fp32"
blocks_to_swap = 36
activation_memory_budget = 0.15
swap_h2d_only = true
fit_report = true
