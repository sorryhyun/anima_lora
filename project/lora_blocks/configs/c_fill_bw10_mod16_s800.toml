# c_fill_v2_mod16_s800 with the B&W colorize pairs cut from half the set to 10 % (185 of 1,667,
# seed 0; post_image_dataset/moss/c_fill_illu_bw10/subset.txt). The outside-mask brightening of
# that run is shared with C v2 and absent from C (no B&W pairs), so the B&W share is the suspect.
# Otherwise the same: empty prompt, a text-layout hole on 90 % of the steps under ref_gate cut,
# muon, lr 5e-5, rank 32, mod_rank 16, tone term off, EMA 0.1, int8 plan, 800 steps.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/c_fill_bw10_mod16_s800.toml"

cache = "post_image_dataset/moss/c_fill_illu_bw10"
output = "output/ckpt_moss_i2i/c_fill_bw10_mod16_s800.safetensors"
max_steps = 800
save_every_steps = 200
ema_window = 0.1
caption_dropout = 1.0
ref_timestep = 0.0
ref_isolate = true
ref_gate = "cut"
gate_holes = "post_image_dataset/moss/c_fill_illu_bw10/hole_layouts.json"
gate_rate = 0.9
tone_weight = 0.0
mod_rank = 16
int8 = "stream"
stream = "fp32"
blocks_to_swap = 36
activation_memory_budget = 0.12
swap_h2d_only = true
