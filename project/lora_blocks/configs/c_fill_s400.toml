# P1 micro arm: the copy / fill block C. Identity pairs over colorize v5's colour
# illustration targets (project/lora_blocks/src/build_c_data.py), the empty prompt on every
# step, a random hole on 90 % of the steps: another page's OCR text layout plus random boxes,
# the hole's image queries cut from the reference keys in the hole (ref_gate cut). The
# sanitize_copy_s300 recipe otherwise (muon, lr 5e-5, rank 32, int8 plan), EMA off, a save
# every 100 steps.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/c_fill_s400.toml"

cache = "post_image_dataset/moss/c_fill_illu"
output = "output/ckpt_moss_i2i/c_fill_s400.safetensors"
max_steps = 400
save_every_steps = 100
ema_window = 0.0
caption_dropout = 1.0
ref_timestep = 0.0
ref_isolate = true
ref_gate = "cut"
gate_holes = "post_image_dataset/moss/c_fill_illu/hole_layouts.json"
gate_rate = 0.9
tone_weight = 0.0
int8 = "stream"
stream = "fp32"
blocks_to_swap = 38
activation_memory_budget = 0.1
swap_h2d_only = true
