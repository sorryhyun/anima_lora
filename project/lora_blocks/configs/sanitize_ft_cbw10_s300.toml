# P2 rerun from the new copy block: sanitize fine-tuned from c_fill_bw10_mod16_s800 (C with
# mod_rank 16, no tone term, B&W pairs at 10 %; reports/c_fill_mod16_bw10.md). sanitize_ft_c_s300
# otherwise (277 pairs, muon, lr 5e-5, rank 32, int8 plan, EMA off, v3's tone term 0.003 from
# half-way). mod_rank 16 because the init carries the modulation adapter (init_lora refuses keys
# the run lacks). Against C-ft / K-ft / v3 in reports/p2_sanitize_ft.md.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/sanitize_ft_cbw10_s300.toml"

cache = "post_image_dataset/moss/i2i_sanitize_idt"
output = "output/ckpt_moss_i2i/sanitize_ft_cbw10_s300.safetensors"
init_lora = "output/ckpt_moss_i2i/c_fill_bw10_mod16_s800.safetensors"
max_steps = 300
save_every_steps = 100
ema_window = 0.0
ref_timestep = 0.0
ref_isolate = true
tone_weight = 0.003
tone_start = 0.5
mod_rank = 16
int8 = "stream"
stream = "fp32"
blocks_to_swap = 36
activation_memory_budget = 0.12
swap_h2d_only = true
