# swap_text v6 on the kv copy block: the shipped v4 recipe (configs/moss/i2i/swap_text/train.toml,
# swap_v6_cbw10_e2: v6 cache 2,908 pairs, 2 epochs, muon lr 5e-5, ema 0.1, mod16, region_weight 2)
# with init from the kv copy block 1111_1546 and ref_adapters = "kv". The one change against v4 is the
# copy block, so the lettering inside the boxes reads kv's "draws the inside of a target badly"
# (sanitize, plan.md) directly. Memory: the kv arm peaks at 13.9 GB at swap 36 / 0.05 (v4 12.3) and OOMed at
# step ~305 with the EMA on the card and at step ~92 with it on the host (jobs 20261114-004912-44113c,
# 20261114-014815-c76637), at step ~840 on swap 40 (13.76 GB peak, ~1.1 GB reserved unallocated; job
# 20261114-015235-129ee4). Now swap 41 / budget 0.02 with the host EMA; 38+ is H2D-bound, so slower than v4.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/1114_0049.toml"

cache = "post_image_dataset/moss/i2i_swap_text_v6"
output = "output/ckpt_moss_i2i/1114_0049.safetensors"
init_lora = "output/ckpt_moss_i2i/1111_1546.safetensors"
epochs = 2
save_every_epochs = 1
ref_timestep = 0.0
ref_isolate = true
ref_adapters = "kv"
mod_rank = 16
region_weight = 2.0
optimizer = "muon"
lr = 5e-5
ema_window = 0.1
int8 = "stream"
stream = "fp32"
ema_card = false
blocks_to_swap = 41
activation_memory_budget = 0.02
swap_h2d_only = true
fit_report = true
