# Plan step 3, v4 data: swap_text ksplit e2 fine-tuned 600 steps on v4 synthetic lettering (every ko
# twin: v3 + readable small-glyph faces and vowel minimal pairs) mixed with
# 400 ko + 200 en edition twins of e2's own cache (hangul_v4_cache.toml). e2's recipe
# (muon 5e-5, rank 32, mod_rank 16, region_weight 2, int8 plan, EMA on the card); a save every 200.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/hangul_v4_ft_e2_s600.toml"

cache = "post_image_dataset/moss/hangul_block_v4"
output = "output/ckpt_moss_i2i/hangul_v4_ft_e2_s600.safetensors"
init_lora = "output/ckpt_moss_i2i/moss_i2i_swap_text_v3_en400_ko1709_ksplit_rw2_mod16_ema5e5_int8_e2.safetensors"
max_steps = 600
save_every_steps = 200
ref_timestep = 0.0
ref_isolate = true
mod_rank = 16
region_weight = 2.0
optimizer = "muon"
lr = 5e-5
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 36
activation_memory_budget = 0.15
swap_h2d_only = true
