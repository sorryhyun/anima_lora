# uncensor on the kv copy block: the int8_e20 uncensor recipe (combined cache, 66 pairs, 20 epochs,
# muon lr 5e-5, ema_window 0.1, mod16) with ref_adapters = "kv", init from the kv copy block 1111_1546,
# and region_weight fixed at 2 (int8_e20 ran 10 → 1). No tone term. Memory plan as 1112_0047
# (swap 34 / budget 0.05). Compare against moss_i2i_uncensor_combined_muon_lr5e5_rw10to1_mod16_int8_e20.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/1114_0002.toml"

cache = "post_image_dataset/moss/i2i_uncensor_combined"
output = "output/ckpt_moss_i2i/1114_0002.safetensors"
init_lora = "output/ckpt_moss_i2i/1111_1546.safetensors"
epochs = 20
save_every_epochs = 5
ref_timestep = 0.0
ref_isolate = true
ref_adapters = "kv"
mod_rank = 16
region_weight = 2.0
tone_weight = 0.0
optimizer = "muon"
lr = 5e-5
ema_window = 0.1
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 34
activation_memory_budget = 0.05
swap_h2d_only = true
fit_report = true
