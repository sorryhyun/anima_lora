# c_fill_bw10_mod16_s800 with the reference beside the image (ref_pos offset) instead of over
# it: the copy has no same-cell position to lean on. Otherwise the same recipe and cache.
# bench/moss_ref_canvas: Base reads canvas (r = 0) and offset (r = 1) coordinates alike under
# ref_isolate, so offset stands in for the canvas of docs/moss/proposal/ref_canvas.md.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/c_fill_bw10_mod16_off_s800.toml"

cache = "post_image_dataset/moss/c_fill_illu_bw10"
output = "output/ckpt_moss_i2i/c_fill_bw10_mod16_off_s800.safetensors"
max_steps = 800
save_every_steps = 200
ema_window = 0.1
caption_dropout = 1.0
ref_timestep = 0.0
ref_isolate = true
ref_pos = "offset"
ref_gate = "cut"
gate_holes = "post_image_dataset/moss/c_fill_illu_bw10/hole_layouts.json"
gate_rate = 0.9
tone_weight = 0.0
mod_rank = 16
int8 = "stream"
stream = "fp32"
blocks_to_swap = 36
activation_memory_budget = 0.12
swap_h2d_only = true
