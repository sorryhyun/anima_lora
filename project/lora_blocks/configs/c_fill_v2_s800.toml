# C v2: the copy / fill block C with the tone term and EMA, on colour illustrations plus their
# B&W colorize conditions (project/lora_blocks/src/build_c_data.py --bw; 1,667 + 1,667 identity
# pairs, the manga__ pages left out). c_fill_s400 otherwise: empty prompt, a text-layout hole
# on 90 % of the steps under ref_gate cut, muon, lr 5e-5, rank 32, int8 plan. The tone term is
# v3's (0.003 from half-way) and leaves the step's hole out; ema_window 0.1 as v3.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/c_fill_v2_s800.toml"

cache = "post_image_dataset/moss/c_fill_illu_bw"
output = "output/ckpt_moss_i2i/c_fill_v2_s800.safetensors"
max_steps = 800
save_every_steps = 200
ema_window = 0.1
caption_dropout = 1.0
ref_timestep = 0.0
ref_isolate = true
ref_gate = "cut"
gate_holes = "post_image_dataset/moss/c_fill_illu_bw/hole_layouts.json"
gate_rate = 0.9
tone_weight = 0.003
tone_start = 0.5
int8 = "stream"
stream = "fp32"
blocks_to_swap = 34
activation_memory_budget = 0.15
swap_h2d_only = true
