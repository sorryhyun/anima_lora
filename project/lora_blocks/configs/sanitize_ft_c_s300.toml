# P2: sanitize fine-tune, from C (c_fill_s400), 300 steps. The sanitize_copy_s300
# recipe (277 pairs, muon, lr 5e-5, rank 32, int8 plan, EMA off) with v3's tone term (0.003
# from half-way). The pair against sanitize_ft_k_s300 and the shipped v3: reports/p2_sanitize_ft.md.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/sanitize_ft_c_s300.toml"

cache = "post_image_dataset/moss/i2i_sanitize_idt"
output = "output/ckpt_moss_i2i/sanitize_ft_c_s300.safetensors"
init_lora = "output/ckpt_moss_i2i/c_fill_s400.safetensors"
max_steps = 300
save_every_steps = 100
ema_window = 0.0
ref_timestep = 0.0
ref_isolate = true
tone_weight = 0.003
tone_start = 0.5
int8 = "stream"
stream = "fp32"
blocks_to_swap = 36
activation_memory_budget = 0.15
swap_h2d_only = true
