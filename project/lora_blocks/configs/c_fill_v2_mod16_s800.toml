# C v2 + mod_rank 16, tone term off. c_fill_v2_s800 otherwise (1,667 colour + 1,667 B&W identity
# pairs, empty prompt, a text-layout hole on 90 % of the steps under ref_gate cut, muon, lr 5e-5,
# rank 32, EMA 0.1, int8 plan). The modulation adapter's t = 0 end is the reference-only part the
# i2i tasks share (docs/moss/findings/mod_rank_i2i.md); the tone term is dropped on the guess that
# it drives C v2's late loss swings and that the modulation adapter holds tone without it.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/c_fill_v2_mod16_s800.toml"

cache = "post_image_dataset/moss/c_fill_illu_bw"
output = "output/ckpt_moss_i2i/c_fill_v2_mod16_s800.safetensors"
max_steps = 800
save_every_steps = 200
ema_window = 0.1
caption_dropout = 1.0
ref_timestep = 0.0
ref_isolate = true
ref_gate = "cut"
gate_holes = "post_image_dataset/moss/c_fill_illu_bw/hole_layouts.json"
gate_rate = 0.9
tone_weight = 0.0
mod_rank = 16
int8 = "stream"
stream = "fp32"
blocks_to_swap = 36
activation_memory_budget = 0.12
swap_h2d_only = true
