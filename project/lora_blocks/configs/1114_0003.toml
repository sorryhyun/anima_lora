# uncensor on the shared-bank copy block: twin of 1114_0002 (kv) — same recipe (combined cache,
# 66 pairs, 20 epochs, muon lr 5e-5, ema_window 0.1, mod16, region_weight 2, no tone term), init from
# c_fill_bw10_mod16_s800 with ref_adapters off. Memory plan of the int8_e20 uncensor run (swap 34 /
# budget 0.15, 12.96 GB peak).
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/1114_0003.toml"

cache = "post_image_dataset/moss/i2i_uncensor_combined"
output = "output/ckpt_moss_i2i/1114_0003.safetensors"
init_lora = "output/ckpt_moss_i2i/c_fill_bw10_mod16_s800.safetensors"
epochs = 20
save_every_epochs = 5
ref_timestep = 0.0
ref_isolate = true
mod_rank = 16
region_weight = 2.0
tone_weight = 0.0
optimizer = "muon"
lr = 5e-5
ema_window = 0.1
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 34
activation_memory_budget = 0.15
swap_h2d_only = true
fit_report = true
