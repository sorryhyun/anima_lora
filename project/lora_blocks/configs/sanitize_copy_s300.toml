# Checkpoint read for the copy question (opinion.md): the sanitize v3 recipe for 300
# steps on the int8 plan, a save every 25 steps, EMA off so each save is the live weights.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/sanitize_copy_s300.toml"

cache = "post_image_dataset/moss/i2i_sanitize_idt"
output = "output/ckpt_moss_i2i/probe_sanitize_copy_s300.safetensors"
max_steps = 300
save_every_steps = 25
ema_window = 0.0
ref_timestep = 0.0
ref_isolate = true
tone_weight = 0.0
int8 = "stream"
stream = "fp32"
blocks_to_swap = 38
activation_memory_budget = 0.1
swap_h2d_only = true
