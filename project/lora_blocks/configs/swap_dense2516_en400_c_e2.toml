# swap_text main run on the relaxed Korean root: every pairs_all page with OCR line-box cover
# >= 10 % or >= 50 caption syllables (the smoke's filter over old + re-crawled works;
# staging/pairs_dense2516.jsonl, 2,516 pairs, 163 works) plus v3's en400 (the en half of
# pairs_en400_ko1709.jsonl): 2,916 pairs. A symlink farm into i2i_swap_text_relax_ko_ksplit and
# i2i_swap_text_v3_all. From C v2 (copy init, reports/swap_dense_copy_init.md), 2 epochs
# (5,832 steps, ~4.3 h). e2's recipe; swap 36 / budget 0.05 as the smoke (0.15 ran out of memory).
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config project/lora_blocks/configs/swap_dense2516_en400_c_e2.toml"

cache = "post_image_dataset/moss/i2i_swap_text_relax_ko_dense2516_en400"
output = "output/ckpt_moss_i2i/swap_dense2516_en400_c_e2.safetensors"
init_lora = "output/ckpt_moss_i2i/c_fill_v2_s800.safetensors"
epochs = 2
save_every_epochs = 1
ref_timestep = 0.0
ref_isolate = true
mod_rank = 16
region_weight = 2.0
optimizer = "muon"
lr = 5e-5
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 36
activation_memory_budget = 0.05
swap_h2d_only = true
fit_report = true
