# SAM3 masking config. Two schemas are accepted:
#
#  1. Flat (this file's default) — one region list for every matched image.
#  2. Rules array (see the commented `rules:` example below) — several mask
#     types routed to different images by `path_pattern`. Every rule whose
#     pattern matches an image COMPOSES (keep-regions union, ignore-regions
#     union). A `rules:` key, when present, replaces the flat fields.
#
# `make mask` (scripts/tasks/masking.py) translates this file into
# anime_tools' SamMaskRequest fields: the flat form is one SAM pass, the rules
# form is one SAM pass per rule, and the merge step's pixel-min union composes
# them. A rule with its own path_pattern runs on that pattern alone.
#
# This file is the CLI's config only: the GUI's Preprocessing tab keeps its
# rule cards on the selected variant ([[variant.stages.masks_sam]]) and sends
# them with the job. Any key left out is the package's own request default:
#   run_sam: true                   # false turns masking off
#
# Since v2 the masks this writes are inert at train time unless
# `masked_loss = true` (configs/base.toml) — that key is the switch, a
# mask tree on disk alone never re-enables masked loss.
#
# Within either schema, `masks` lists the regions, one ROLE:KIND:VALUE each:
#   ROLE  keep    train ONLY inside the union of the keep regions
#                 (e.g. `keep:text:girl` masks the whole background)
#         ignore  mask this region OUT of the loss — out of the keep region,
#                 or out of the whole image when nothing is kept
#   KIND  text    VALUE is a SAM3 text prompt
#         soft    VALUE is a learned prompt .safetensors
#                 (networks/calibration/sam3_girl_prompt.safetensors is the
#                 shipped subject prompt)
# The pre-0.6.4 keys still read: `prompts` → ignore:text, `focus_prompts` →
# keep:text (`girl` in either → the shipped soft prompt).

masks:
  - ignore:text:speech bubble
  - ignore:text:text bubble

threshold: 0.7
dilate: 3
# Global scope: which images get masked at all.
path_pattern: '*'

# ── Rules form (uncomment to route different mask types per image) ───────────
# rules:
#   - path_pattern: 'character_a/*'   # train only the character here
#     masks: [keep:text:girl]
#     dilate: 8
#   - path_pattern: 'manga/*'         # strip speech bubbles here
#     masks: [ignore:text:speech bubble, ignore:text:text bubble]
#   - path_pattern: '*'               # catch-all default (per-rule threshold/
#     masks: [ignore:text:speech bubble]  # dilate fall back to the top-level values)
