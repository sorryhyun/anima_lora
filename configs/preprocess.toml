source_image_dir = "image_dataset"

target_res = [1024, 896]

# Where `make mask` writes merged masks, and where training looks them up
# ({stem}_mask.png, mirroring the resized/ subdir layout). Relative to the repo
# root (absolute paths work too). Consumed by `make mask` / `make mask-clean`,
# `make preprocess-reconcile`, the GUI mask counter/overlay, and — as the
# lowest-priority fallback under a subset's own `mask_dir` — training. Training
# ignores it when the directory doesn't exist, so a maskless checkout is
# unaffected.
mask_dir = "post_image_dataset/masks"

caption_shuffle_variants = 4

caption_tag_dropout_rate = 0.1

caption_tag_randomize_rate = 0.0

caption_position_clauses = false

# Tag groups stripped from every mirrored caption (GH #95); master untouched.
# Slugs (artist, character, copyright, meta, clothing, accessory, action, pose,
# expression, face, hair, body, background, effect, object, animal, color,
# person, lighting, weather, text, style_parody, framing, sexual, weapon, food,
# species, fashion_style) or a literal '대분류 > 소분류' path prefix from
# models/danbooru_tags_classified.csv. Env CAPTION_DROP_GROUPS / CLI
# --caption_drop_groups override. Unknown tags are never dropped.
# caption_drop_groups = "artist,lighting"

sigma_demote = "1024:896,1024:768"

drop_lowres_images = true
min_pixels = 250000

freefit_max_ratio = 4.0
