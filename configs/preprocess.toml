# Preprocess settings — split out of base.toml so they survive `make update`.
# Read by the preprocess pipeline via library.config.io.load_path_overrides,
# layered: preprocess.toml → base.toml → presets.toml[<preset>] → methods/<method>.
# `target_res` is dual-use: train.py reads it too (though it's inert at train time
# — the on-disk caches are the source of truth for which tiers are present).

source_image_dir = "image_dataset"

# Multi-scale constant-token tiers. Each image goes to the tier that resizes it
# the LEAST (see library/datasets/buckets.py). Allowed edges: 512 768 896 1024
# 1280 1536. `[1024]` = single ~1MP tier. Override: make preprocess ARGS="--target_res 1024 1536"
target_res = [1024, 896]

# Caption shuffle variants per image (0 = single caption). v0 = pristine original;
# v1..v{N-1} are smart-shuffled, with optional tag dropout / identity-randomize.
# The strategy loader picks v0 at 20%, uniform v1..v{N-1} at 80%. Env override:
# CAPTION_SHUFFLE_VARIANTS=N make preprocess-te
caption_shuffle_variants = 4

# Per-tag dropout probability applied to v1..v{N-1} only (presence axis; tags up
# to and including the first @artist marker are protected). Env: CAPTION_TAG_DROPOUT_RATE
caption_tag_dropout_rate = 0.1

# Lexinvariant tag regularization (arXiv:2305.16349): per-tag probability of
# *erasing a tag's identity* — replacing the tag string with a meaningless token
# while keeping its slot, @artist prefix included (the IDENTITY axis, vs dropout's
# presence axis). Writes a parallel `r`-family alongside the `v`-family in the same
# cache; pick the arm at train time with `use_randomized_caption_variants` (no
# re-preprocess to A/B). 0.0 = off (no r-family). Needs caption_shuffle_variants >= 2.
# Re-running with this > 0 upgrades existing caches in place. Paper's prior ~0.2.
# Override: make preprocess ARGS="--caption_tag_randomize_rate 0.2"
caption_tag_randomize_rate = 0.0

# σ-demote sibling latents (sigma_lowres Phase 1b). true = after every VAE pass
# (`make preprocess` / `preprocess-vae`) also emit the demoted_{H}x{W} keys the
# `--sigma_lowres` trainer swaps to, on the measured-safe 1024:896 route — so the
# sibling cache never goes stale as images are added. A "NATIVE:DEMOTE" string
# picks another route (probe it first — 1024:896 is the only measured-safe one).
# false = emit only via the explicit `make preprocess-demote`. Env: SIGMA_DEMOTE.
sigma_demote = false

# Preprocess input filter. drop_lowres_images = false keeps every image; otherwise
# images under min_pixels are skipped at resize/VAE/TE. Override per-run:
#   make preprocess ARGS="--min_pixels 0 | --no_drop_lowres | --drop_lowres"
drop_lowres_images = true
min_pixels = 250000

# Free-aspect token-band resize ("free-fit") is the only resize mode: images keep
# their native aspect ratio and land anywhere inside the tier's token band, driving
# crop loss to ~zero (the old discrete constant-token bucket pool was removed).
# Max aspect-ratio clamp for free-fit (1:R / R:1); beyond-clamp images cover-crop to
# the limit. Preprocess-only. Override: make preprocess ARGS="--freefit_max_ratio 3.0"
freefit_max_ratio = 4.0
