name = "sanitize"

[staging]
tag_any = ["speech bubble", "thought bubble", "blank speech bubble", "spoken text", "english text", "japanese text", "sound effects", "text focus", "zzz", "company name", "character name"]

image_dirs = ["{CAPTION_CORPUS_DIR}/retrieved"]
sim_min = 0.85
match_frac_min = 0.3
cell_match_min = 0.9
max_extra_diff = 25

add_identity_pairs = 0.25
identity_saturation_min = 0.4

[preprocess]
recursive = true
vae = 'models/vae/qwen_image_vae.safetensors'
batch_size = 4
chunk_size = 64
qwen3 = 'models/text_encoders/qwen_3_06b_base.safetensors'
dit = 'models/diffusion_models/anima-base-v1.0.safetensors'
caption_shuffle_variants = 4
caption_tag_dropout_rate = 0.1
target_res = [896, 1024]
pe_encoder = "pe_spatial"

[training]
network_dim = 32
network_alpha = 128
masked_loss=false
target_res = [896, 1024]

network_args = [
    "b_cond_init=-4.0",
    "cond_scale=1.0",
    "apply_ffn_lora=1",
    "cond_res_scale=1.0",
    "use_repa=true",
    "repa_weight=0.05",
    "repa_layer=8",
    "repa_target_dog=true",
    "repa_timestep_weighting=1.0",
]
output_name = "anima_easycontrol_sanitize"

learning_rate = 2e-5
max_train_epochs = 6
save_every_n_epochs = 6
checkpointing_epochs = 6

easycontrol_cond_noise_max = 0.0
caption_dropout_rate = 1.0
easycontrol_drop_p=0.0

activation_memory_budget = 0.7

cond_diff_loss = true

[general]
caption_extension = '.txt'

[[datasets]]
batch_size = 1

  [[datasets.subsets]]
  image_dir = 'post_image_dataset/easycontrol/{name}/resized'
  cache_dir = 'post_image_dataset/easycontrol/{name}/cache'
  cond_cache_dir = 'post_image_dataset/easycontrol/{name}/cond'
  path_pattern = '*_no_tags.*'
  recursive = true
  flip_aug = false
  num_repeats = 1

[variant]
family = "easycontrol"
label = "Sanitize (remove text / bubbles)"
description = "Remove on-page text, speech/thought bubbles and SFX. Mines in-artist near-twin pairs that differ only by a text tag; cond = the texted member, target = the clean twin. Configured in configs/easycontrol/sanitize.toml (edit the file directly)."
order = 30
