name = "phash_edit"

# phash-mined aligned instruction-edit descriptor. Three steps, one config:
#
#   make easycontrol-staging    EASYADAPTER=phash_edit   # mine the pair tree
#   make easycontrol-preprocess EASYADAPTER=phash_edit   # resize + VAE/TE + cond
#   make easycontrol            EASYADAPTER=phash_edit   # train
#
# Everything below the sentinel at the bottom is regenerated by the miner; the
# three tables here survive re-runs verbatim.

[staging]
# The RAW crawl pool. NOT selected/ — that tree is the deduplicated curation and
# has almost no variant pairs left (72 at tag-delta <= 16 out of 4.5M). Needs
# gelcrawl's .hash_cache.json in each root (`make post` writes it).
image_dirs = ["{CAPTION_CORPUS_DIR}/retrieved"]

phash_max = 40              # 256-bit Hamming; random pairs sit at 128, spot-checked aligned through 36
delta_min = 1               # 0 = identical captions = empty instruction
delta_max = 0               # no cap: a tag-delta prefilter throws away aligned pairs whose caption moved
drop_count_flip = true      # 1girl <-> 4girls is a different scene, not an edit
same_artist_only = true
max_pairs_per_image = 4     # stop one variant series dominating; tightest pairs claim quota first
max_pairs_per_artist = 0
both_directions = true      # teach every attribute as both an addition and a removal
instruction_format = "prefix"   # "prefix": `glasses, -hat`  |  "word": `add glasses, remove hat`
removal_prefix = "-"
ar_max_log2 = 0.0           # off: same artist = same canvas, so AR divergence is ~0 and gates nothing

# --- synthetic arms, sized as a share of the FINAL directed set --------------
# Both ride the same pool: the target latent is one the edit arm already
# encoded, so an arm record costs at most one extra *cond* encode.
identity_frac = 0.02        # no-op records: cond IS the target latent, caption empty
colorize_frac = 0.20        # cond = mangafied B&W of the target (XDoG + screentone)
colorize_dropout = 0.8      # tag dropout on the color-tag caption form
colorize_variants = 4       # per-variant coin flip: `-monochrome, -greyscale` vs color tags

[preprocess]
# The miner stages a DEDUPLICATED pool/, not a per-pair tree: resize + VAE run
# over the distinct images once, then every pair view (resized image, target
# latent, cond latent) is a symlink over it and only the delta captions are
# TE-encoded. At the knobs above that is 2.7k resize+VAE and 3.7k TE encodes
# instead of 7.4k of each. Paths default to <base>/{pool,resized,cache,cond}
# and <base>/pairs.json; set pool_dir / manifest here to override.
recursive = true
vae = 'models/vae/qwen_image_vae.safetensors'
batch_size = 4
chunk_size = 64
qwen3 = 'models/text_encoders/qwen_3_06b_base.safetensors'
dit = 'models/diffusion_models/anima-base-v1.0.safetensors'
target_res = [896, 1024]
caption_shuffle_variants = 4
# 0.0, NOT the 0.1 default: dropping part of an edit instruction leaves the
# target unexplained. Shuffling is fine (both instruction formats are flat bags).
caption_tag_dropout_rate = 0.0

[training]
network_dim = 32
network_alpha = 128
target_res = [896, 1024]

network_args = [
    "b_cond_init=-4.0",     # fixed hyperparameter: b_cond never drifts off its init in practice
    "cond_scale=1.0",
    "apply_ffn_lora=1",
    "cond_res_scale=1.0",
]
output_name = "anima_easycontrol_phash_edit"

learning_rate = 2e-5
max_train_epochs = 4
save_every_n_epochs = 4
checkpointing_epochs = 4

# THE knob for an instruction editor: the prompt IS the task, so it must never be
# dropped. (near_twins/sanitize sets 1.0 because there the task is a fixed prior.)
caption_dropout_rate = 0.0
easycontrol_drop_p = 0.05
easycontrol_cond_noise_max = 0.0
# Off since the colorize arm landed: gray->color differs *everywhere*, so the
# diff map degenerates to ~uniform there (the flag's own help says so) while the
# identity arm's map is exactly uniform by construction. Reweighting only the
# edit arm out of three would bias the mix rather than focus it.
cond_diff_loss = false

# 16GB recipe for descriptor runs at 896/1024. 0.7 alone OOMs at step 0; 0.7 +
# aggressive survives ~900 steps then OOMs on the first worst-case bucket. 0.3
# costs ~5% step time and holds. Watch a new EC arm through a FULL first epoch.
activation_memory_budget = 0.35
# partitioner_aggressive_recomputation = true
blocks_to_swap = 0

# NOTE on the identity arm: these ARE the empty-instruction no-op pairs the
# twin_edit arm failed on ("aligned cond + short prompt -> exact copy", which
# swallowed small edits and hardened the inversion copy-lock). Held to 2% here,
# against ~14% of the edit arm being genuinely terse (delta <= 3, 542 records) so
# "short prompt" is not by itself a copy signal. If small edits start getting
# swallowed, this arm is the first suspect — drop identity_frac to 0 and re-mine.

# === generated dataset blueprint (rewritten by the miner; do not edit below) ===
# phash-mined aligned edit pairs wired as an EasyControl *instruction-edit*
# control task. The miner stages a DEDUPLICATED `pool/` of the participating
# images; the preprocess step resizes and VAE-encodes that pool ONCE, then
# materializes every pair as symlinks over it — a `{pair}_no_tags` image in
# `resized/`, its latent in `cache/`, and the partner's latent under the same
# stem in `cond/`. Only the delta captions are TE-encoded.
#
# Roles (EasyControl: cache_dir = denoising target, cond_cache_dir = condition):
#   target = the `_no_tags` view; its caption is the TAG DELTA vs the cond,
#            i.e. an edit instruction, not a description.
#   cond   = the partner's latent (the source image fed via set_cond), filed
#            under the target stem at its own bucket (cond != target shapes are
#            supported; cond_diff_loss self-skips on a mismatch).
# So the adapter learns: given THIS image and THIS edit instruction, produce the
# edited result. Shared tags cancel out of the delta, so the character name is
# absent from the prompt and identity must come from the cond stream.
#
# `path_pattern` keeps only the `_no_tags` views as targets — the resized pool
# members are not denoising targets and carry no caption.
# `{name}` below interpolates from the top-level `name` key at train time.

[general]
caption_extension = '.txt'

[[datasets]]
batch_size = 1

  [[datasets.subsets]]
  image_dir = 'post_image_dataset/easycontrol/{name}/resized'
  cache_dir = 'post_image_dataset/easycontrol/{name}/cache'        # denoising target: the _no_tags members
  cond_cache_dir = 'post_image_dataset/easycontrol/{name}/cond'    # condition: the paired _tags latent (keyed by the _no_tags stem)
  path_pattern = '*_no_tags.*'     # targets = the edited members only
  recursive = true                 # tree is nested <artist>/<pair_id>_no_tags; caches mirror it
  flip_aug = false                 # latents can't be flipped post-hoc; the cond cache has no flipped variant
  num_repeats = 1
