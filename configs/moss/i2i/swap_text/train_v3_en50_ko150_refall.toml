# Plan B arm of the reference_adapters A/B: train_v3_en50_ko150.toml with ref_adapters = all
# at rank 32. The main bank at rank 32 stays on the image and text rows.
# The second bank adds about 1.2 GB on the card (masters, grads, momentum, EMA): at swap 38,
# budget 0.1 this config ran out of VRAM at step 296, hence swap 40, budget 0.05.
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/swap_text/train_v3_en50_ko150_refall.toml"

cache = "post_image_dataset/moss/i2i_swap_text_v3_en50_ko150"
output = "output/ckpt_moss_i2i/moss_i2i_swap_text_v3_en50_ko150_refall_rw2_mod16_ema5e5_int8_e3.safetensors"
ref_adapters = "all"
ref_rank = 32
ref_timestep = 0.0
ref_isolate = true
mod_rank = 16
region_weight = 2.0
optimizer = "muon"
lr = 5e-5
epochs = 3
save_every_epochs = 1
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 40
activation_memory_budget = 0.05
swap_h2d_only = true
fit_report = true
