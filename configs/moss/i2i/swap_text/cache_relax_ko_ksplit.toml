# MOSS i2i cache for swap_text on the relaxed root (ko only, text-only paste, page gates
# 12 / 0.05; i2i_tasks/configs/swap_text.toml), Hangul split into syllable tokens as in the
# ksplit configs. pairs_all.jsonl is the staged pairs.jsonl minus the two Korean eval works
# (589883, 737486). A fresh folder: no symlinks into another cache, so the latents encode
# normally.
#
#   make daemon-run ARGS="--stall-timeout 1800 scripts/moss/cache.py --config configs/moss/i2i/swap_text/cache_relax_ko_ksplit.toml"
# The cache folder i2i_swap_text_relax_ko_ksplit was deleted on 2026-11-09; this config stays as the recipe.

pairs = "post_image_dataset/i2i/swap_text_relax/staging/pairs_all.jsonl"
out = "post_image_dataset/moss/i2i_swap_text_relax_ko_ksplit"
resolution = 1024
ref_scale = 1
caption_format = "layout_json"
token_split = "syllable"

# i2i stays on the pipeline prompt (the t2i default is sure; library/moss/prompt_tail.py).
prompt_tail = "off"
