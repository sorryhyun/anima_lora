# en400_ko1709 with Hangul split into syllable tokens. The folder holds symlinks into
# i2i_swap_text_v3_all except the ko TE files, which this job writes: a TE file reached
# through a symlink would be overwritten in the source cache. skip_latents: the staged images
# are newer than the cached latents, so the mtime check would re-encode them and replace the
# symlinks with copies.
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/cache.py --config configs/moss/i2i/swap_text/cache_v3_en400_ko1709_ksplit.toml"

pairs = "post_image_dataset/i2i/swap_text_v3/staging/pairs_en400_ko1709.jsonl"
out = "post_image_dataset/moss/i2i_swap_text_v3_en400_ko1709_ksplit"
resolution = 1024
ref_scale = 1
caption_format = "layout_json"
token_split = "syllable"
skip_latents = true

# i2i stays on the pipeline prompt (the t2i default is sure; library/moss/prompt_tail.py).
prompt_tail = "off"
