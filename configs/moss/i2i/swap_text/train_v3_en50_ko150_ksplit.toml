# train_v3_en50_ko150.toml on syllable tokens: 50 en + 150 ko of pairs_en200_ko800.jsonl
# (seed 0, staging/pairs_en50_ko150.jsonl), the v3 int8 recipe, 3 epochs = 600 steps.
# Cache: cache_v3_en50_ko150_ksplit.toml.
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/swap_text/train_v3_en50_ko150_ksplit.toml"

cache = "post_image_dataset/moss/i2i_swap_text_v3_en50_ko150_ksplit"
output = "output/ckpt_moss_i2i/moss_i2i_swap_text_v3_en50_ko150_ksplit_rw2_mod16_ema5e5_int8_e3.safetensors"
ref_timestep = 0.0
ref_isolate = true
mod_rank = 16
region_weight = 2.0
optimizer = "muon"
lr = 5e-5
epochs = 3
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 38
activation_memory_budget = 0.1
swap_h2d_only = true
fit_report = true
