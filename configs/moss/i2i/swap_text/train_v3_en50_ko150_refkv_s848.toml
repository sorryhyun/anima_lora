# Plan A at the shared bank's 25.4-minute budget: train_v3_en50_ko150_refkv.toml run to
# 848 steps (1.80 s/step against 2.55) instead of 600.
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/swap_text/train_v3_en50_ko150_refkv_s848.toml"

cache = "post_image_dataset/moss/i2i_swap_text_v3_en50_ko150"
