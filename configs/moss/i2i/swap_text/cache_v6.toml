# MOSS i2i cache for swap_text v6: the relaxed root's dense Korean pages (pairs_dense2516.jsonl,
# 2,508 after the 2026-11-09 audit and restage, captions from the v5 reader with line breaks)
# plus v3's en400 (the en half of pairs_en400_ko1709.jsonl, recaptioned from a v5 re-read,
# swap_text_v3/recaption_en400.py). pairs_v6.jsonl lists both; the en rows point into
# ../../swap_text_v3/staging/. A fresh folder: 1,140 of the dense pages pasted differently
# after the restage, so every latent encodes again.
#
#   make daemon-run ARGS="--queue --stall-timeout 1800 scripts/moss/cache.py --config configs/moss/i2i/swap_text/cache_v6.toml"

pairs = "post_image_dataset/i2i/swap_text_relax/staging/pairs_v6.jsonl"
out = "post_image_dataset/moss/i2i_swap_text_v6"
resolution = 1024
ref_scale = 1
caption_format = "layout_json"
token_split = "syllable"

# i2i stays on the pipeline prompt (the t2i default is sure; library/moss/prompt_tail.py).
prompt_tail = "off"
