# swap_text scale-up: the v3 en200_ko800 int8 2-epoch request on 2,109 pairs. Every ko pair
# of pairs_all.jsonl (1,709), the old list's 200 en pages and a seed-0 fill of 200.
# The cache folder holds symlinks into i2i_swap_text_v3_all.
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/swap_text/train_v3_en400_ko1709.toml"

cache = "post_image_dataset/moss/i2i_swap_text_v3_en400_ko1709"
output = "output/ckpt_moss_i2i/moss_i2i_swap_text_v3_en400_ko1709_rw2_mod16_ema5e5_int8_e2.safetensors"
ref_timestep = 0.0
ref_isolate = true
mod_rank = 16
region_weight = 2.0
optimizer = "muon"
lr = 5e-5
epochs = 2
save_every_epochs = 1
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 36
activation_memory_budget = 0.1
swap_h2d_only = true
fit_report = true
