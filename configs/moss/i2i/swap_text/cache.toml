# MOSS i2i cache for the swap_text task (JA page → translated lettering) — CacheRequest fields.
#
#   make i2i-stage TASK=swap_text                  # hitocrawl twins → pairs.jsonl
#   make i2i-preprocess TASK=swap_text MODEL=moss  # this file → scripts/moss/cache.py
#
# Each row caches its target (the JA page with the captioned regions pasted from the
# translated edition) as the latent and the JA page as {stem}.moss_ref. The staged
# captions are already layout JSON (one text item per target line), which
# layout_json passes through.

pairs = "post_image_dataset/i2i/swap_text_v3/staging/pairs.jsonl"
out = "post_image_dataset/moss/i2i_swap_text_v3"
resolution = 1024
# Full-size reference: everything but the lettering is copied.
ref_scale = 1
caption_format = "layout_json"
