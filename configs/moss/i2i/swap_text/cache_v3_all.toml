# MOSS i2i cache for swap_text on the whole v3 pool: every staged pair except the four
# eval works (1483610, 3124789, 589883, 737486), which pairs_all.jsonl leaves out by work.
# Otherwise as cache.toml.
#
#   make daemon-run ARGS="--stall-timeout 1800 scripts/moss/cache.py --config configs/moss/i2i/swap_text/cache_v3_all.toml"

pairs = "post_image_dataset/i2i/swap_text_v3/staging/pairs_all.jsonl"
out = "post_image_dataset/moss/i2i_swap_text_v3_all"
resolution = 1024
# Full-size reference: everything but the lettering is copied.
ref_scale = 1
caption_format = "layout_json"

# i2i stays on the pipeline prompt (the t2i default is sure; library/moss/prompt_tail.py).
prompt_tail = "off"
