# swap_text en400_ko1709 at 4 epochs, grad_accum 2: 8,436 samples = 4,218 updates, the
# update count of the 2-epoch batch-1 run. swap 34 from the 40-step fit report at swap 36
# (peak 13.11 GB, about 1 GB free).
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/swap_text/train_v3_en400_ko1709_ga2_e4.toml"

cache = "post_image_dataset/moss/i2i_swap_text_v3_en400_ko1709"
output = "output/ckpt_moss_i2i/moss_i2i_swap_text_v3_en400_ko1709_rw2_mod16_ema5e5_int8_ga2_e4.safetensors"
ref_timestep = 0.0
ref_isolate = true
mod_rank = 16
region_weight = 2.0
optimizer = "muon"
lr = 5e-5
epochs = 4
grad_accum = 2
save_every_epochs = 1
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 34
activation_memory_budget = 0.1
swap_h2d_only = true
fit_report = true
