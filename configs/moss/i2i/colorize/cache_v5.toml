# v5 (control captions, docs/moss/proposal/colorize_v5_control.md): v4's scale on the
# control recipe. The 1k arm's pages are a prefix of this draw (same seed, same holdout),
# so `out` points at its dir and reuses its latents, refs, OCR reads and SAM3 tags.
out = "post_image_dataset/moss/i2i_colorize_control_1k"
n = 1667
manga = 1667
holdout = 8
manga_holdout = 4
resolution = 1024
ref_scale = 1
vision = false
captions = "control"
variants = 4            # embeds + embeds_v1..v3: four draws
tag_dropout = 0.8
text_encoder = "int8"
