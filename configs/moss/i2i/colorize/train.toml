# MOSS i2i training for the colorize task — TrainRequest fields; the v4 recipe
# (moss_colorize_3k_textref1_iso_muon_ema: muon, kaiming, ema_window 0.1 are the
# TrainRequest defaults; project/finished/moss_lora/README.md).
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/colorize/train.toml"

cache = "post_image_dataset/moss/i2i_colorize"
output = "output/ckpt_moss_i2i/moss_i2i_colorize.safetensors"
epochs = 3
max_steps = 10000
lr = 5e-5
save_every_epochs = 1
plain_caption_rate = 0.0       # a vision-off cache has no embeds_plain
caption_variant_rate = 0.3     # of the rest, sparse / bare colour tags under the OCR layout; else the full one
ref_timestep = 0.0             # the reference is clean
ref_isolate = true             # ref queries see only ref keys
# OCR layouts run to ~2.2k text rows: start on the worst case.
fit_report = true
# i2i samples carry reference tokens: the bf16 t2i plan (swap 36, budget 0.5) OOMs.
# Swap 38 makes room for budget 0.175, which runs ~9% faster than swap 28 / 0.15 at
# ~8.3k joint tokens (sanitize, 2026-10-26); the H2D-only swap keeps 38 off the
# PCIe knee (classic and H2D tie up to 38, H2D is 8% faster at 40).
# int8 has trained no i2i LoRA: these stay the measured bf16 plan.
int8 = "off"
stream = "bf16"
ema_card = false
blocks_to_swap = 38
activation_memory_budget = 0.175
swap_h2d_only = true
