# MOSS i2i training for the colorize task — TrainRequest fields; the v5 recipe
# (docs/moss/proposal/colorize_v5_control.md): v4's schedule (3 epochs, 10000 steps,
# Muon 5e-5; kaiming and ema_window 0.1 are the TrainRequest defaults) on the int8 base.
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/colorize/train.toml"
#
# moss_colorize_v5 ran 374 min at 2.2 s/step on this plan, peak 13.8 GB.

cache = "post_image_dataset/moss/i2i_colorize_control_1k"
output = "output/ckpt_moss_i2i/moss_colorize_v5.safetensors"
epochs = 3
max_steps = 10000
lr = 5e-5
optimizer = "muon"
save_every_epochs = 1
plain_caption_rate = 0.2       # embeds_plain: the bare caption (empty / comic)
caption_variant_rate = 0.75    # of the rest: the four draws equally (embeds + v1..v3)
ref_timestep = 0.0             # the reference is clean
ref_isolate = true             # ref queries see only ref keys
fit_report = true
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 34
activation_memory_budget = 0.15
swap_h2d_only = true
