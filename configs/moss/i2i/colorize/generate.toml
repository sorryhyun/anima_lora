# MOSS i2i test for the colorize task — GenerateRequest fields.
#
#   make daemon-run ARGS="scripts/moss/generate.py --config configs/moss/i2i/colorize/generate.toml \
#       --lora output/ckpt_moss_i2i/moss_colorize_v5.safetensors --ref_image <page or folder>"
#
# The page is a full-size VAE reference, as the cache encoded it; the TE sees the
# prompt only (ref_vision off). ref_isolate comes from the LoRA's metadata.

prompt = "comic"
ref_scale = 1
ref_vision = false
text_encoder = "int8"
steps = 30
spectrum = true
out_dir = "output/tests/moss_i2i_colorize"

# i2i stays on the pipeline prompt (the t2i default is sure; library/moss/prompt_tail.py).
prompt_tail = "off"
