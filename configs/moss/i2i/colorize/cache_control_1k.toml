# Control-caption arm (2026-11-03): no OCR. Illustrations draw from their colour + series
# tags (bare: empty). Manga pages always carry comic + box-only AnimeText blocks and draw
# per-character hair / clothing colour boxes (bare: none). Each draw drops 80 %.
out = "post_image_dataset/moss/i2i_colorize_control_1k"
n = 500
manga = 500
holdout = 8
manga_holdout = 4
resolution = 1024
ref_scale = 1
vision = false
captions = "control"
variants = 4            # embeds + embeds_v1..v3: four draws
tag_dropout = 0.8
text_encoder = "int8"
