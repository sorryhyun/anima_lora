# Control-caption arm on the int8 base: 1250 steps, as the 1-hour arm moss_colorize_1k_textref1_iso.
cache = "post_image_dataset/moss/i2i_colorize_control_1k"
output = "output/ckpt_moss_i2i/moss_colorize_control_1k_int8.safetensors"
max_steps = 1250
epochs = 2
lr = 5e-5
optimizer = "muon"
plain_caption_rate = 0.2       # embeds_plain: the bare caption (empty / comic)
caption_variant_rate = 0.75    # of the rest: the four draws equally (embeds + v1..v3)
ref_timestep = 0.0
ref_isolate = true
fit_report = true
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 36
activation_memory_budget = 0.1
swap_h2d_only = true
