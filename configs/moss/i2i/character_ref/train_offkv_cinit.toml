# character_ref from the offset + kv copy block: init c_fill_bw10_mod16_off_kv_lr2e4_s4800
# (project/lora_blocks/reports/offset_kv_copy.md). lr 2e-4 = the init's lr: at 5e-5 a fine-tune
# moves that init ~10 % (its ‖ΔW‖ is 10× the aligned C's). offset + kv + mod_rank 16 are the
# init's own (its export adapters exist only under kv). 1,000 steps = one epoch, as e1 / off_e1.
#
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/character_ref/train_offkv_cinit.toml"

cache = "post_image_dataset/moss/i2i_character_ref"
output = "output/ckpt_moss_i2i/moss_i2i_character_ref_offkv_cinit.safetensors"
init_lora = "output/ckpt_moss_i2i/c_fill_bw10_mod16_off_kv_lr2e4_s4800.safetensors"
ref_timestep = 0.0
ref_isolate = true
ref_pos = "offset"
ref_adapters = "kv"
mod_rank = 16
optimizer = "muon"
lr = 2e-4
max_steps = 1000
save_every_steps = 250
int8 = "stream"
stream = "fp32"
ema_card = true
# the kv plan (peak 13.2 GB with ref_gate cut on the c_fill cache, 12.3 GB without)
blocks_to_swap = 34
activation_memory_budget = 0.05
swap_h2d_only = true
fit_report = true
