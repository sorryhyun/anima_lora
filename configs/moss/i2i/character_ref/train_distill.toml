# character_ref with the D-OPSD off-policy teacher (add90 ema97, configs/moss/selfdistill.toml):
# the flow loss on every step, plus on steps with sigma >= 0.9 the velocity of an EMA 0.97 copy
# of the LoRA that also has the TARGET image in the TE ahead of the caption (the privileged
# input; the student has only the isolated reference latent + the stripped caption). Same
# fixed point as FM, lower-variance target at high sigma, where identity is decided and the
# reference's FM signal (~-0.001 against a ~0.4 loss, docs/moss/proposal/ref_canvas.md) drowns.
# Reference on ref_adapters kv (Base stream, no backward; export adapters on proj.k / proj.v),
# so the read gets the whole gradient. Otherwise the e1 run's request (aligned, kaiming, lr 5e-5,
# 1 epoch = 1,000 steps): against moss_i2i_character_ref_e1 two things differ (kv, teacher).
# lr stays 5e-5: the 2e-4 need was measured on offset kv C only; aligned kv is untried.
# Swap is the kv plan of train_offkv_cinit.toml (peak 12.8 GB on this cache).
#
#   make daemon-run ARGS="--queue --stall-timeout 3600 scripts/moss/distill_cache.py --cache post_image_dataset/moss/i2i_character_ref"
#   make daemon-run ARGS="--queue --stall-timeout 900 scripts/moss/train.py --config configs/moss/i2i/character_ref/train_distill.toml"

cache = "post_image_dataset/moss/i2i_character_ref"
output = "output/ckpt_moss_i2i/1111_1413.safetensors"
ref_timestep = 0.0
ref_isolate = true
ref_adapters = "kv"
optimizer = "muon"
lr = 5e-5
epochs = 1
save_every_steps = 250
int8 = "stream"
stream = "fp32"
ema_card = true
blocks_to_swap = 34
activation_memory_budget = 0.05
swap_h2d_only = true
fit_report = true

distill = "ema"
distill_ema_decay = 0.97
distill_sigma_min = 0.9
distill_add = 1.0
