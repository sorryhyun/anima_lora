# MOSS i2i test for the sanitize task — GenerateRequest fields.
#
#   make daemon-run ARGS="scripts/moss/generate.py --config configs/moss/i2i/sanitize/generate.toml \
#       --lora output/ckpt_moss_i2i/moss_i2i_sanitize.safetensors --ref_image <page or folder>"
#
# The cache's fixed caption, verbatim; the texted page is the full-size reference.

prompt = "no sfx, no dialogue, no watermark"
prompt_format = "text"
ref_scale = 1
out_dir = "output/tests/moss_i2i_sanitize"

# i2i stays on the pipeline prompt (the t2i default is sure; library/moss/prompt_tail.py).
prompt_tail = "off"
