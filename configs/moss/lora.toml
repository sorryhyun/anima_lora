# MOSS-Image LoRA training — field defaults for scripts/moss/train.py.
#
#   make daemon-run ARGS="--stall-timeout 900 scripts/moss/train.py --config configs/moss/lora.toml"
#
# Keys are TrainRequest field names (library/moss/requests.py, `--help` lists
# them); CLI flags win over this file, and a key left out keeps the field
# default. Values below are the shipped defaults. User doc: docs/moss/README.md.

cache = "post_image_dataset/moss"
output = "output/ckpt_moss/moss_lora.safetensors"
model = "base"                 # base | sft
epochs = 8
max_steps = 0                  # 0 = epochs decide
save_every_epochs = 0          # 0 = final only

algo = "lora"                  # lora | lokr | loha
rank = 32
# alpha = 128.0                # unset: 128 for lora, = rank for lokr / loha
# factor = -1                  # lokr only
down_init = "kaiming"          # lora only: kaiming | weight_svd | weight_svd_nodc (docs/moss/findings/muon_channel_init.md)
# mod_rank = 16                # opt-in: also adapt shared_block_modulation (timestep shift/scale/gate, shared by all 42 blocks); lora only
# mod_alpha = 90.5             # unset: alpha · sqrt(mod_rank / rank)
# svd_slice = 0                # weight_svd only: window [k·r, (k+1)·r) of W0's basis
# svd_slice_count = 0          # > 0: interleaved slices {k, k+N, …}
optimizer = "muon"             # muon | adamw (lokr / loha always adamw); docs/moss/findings/muon_lora.md
lr = 5e-5
warmup_ratio = 0.05
grad_accum = 1                 # samples per optimizer update; warmup counts updates
caption_dropout = 0.0
plain_caption_rate = 0.2       # layout_json cache: share of steps on the plain Anima caption
caption_variant_rate = 0.0     # cache with embeds_v{k} (colorize probe): x (1 - plain_caption_rate) of steps
ema_window = 0.1               # adapter EMA over 10 % of the updates (0.958 at 240); saves write it, raw goes to <name>/<name>_raw; docs/moss/findings/ema_lr1e4.md
lora_dtype = "bf16"            # bf16 | fp16 | fp32

# Memory / speed (16 GB card): int8 base, every block resident. docs/moss/optimization/int8.md.
# The int8 base refuses loha; configs/moss/lora_bf16.toml is the bf16 plan.
int8 = "stream"                # off | fwd | full | stream
int8_file = ""                 # empty: the catalog's GPTQ file on Base, fetched on first use; round to nearest on SFT; "rtn" forces that
stream = "fp32"                # residual stream: int8 + fp32 sits below bf16's prediction error
ema_card = true                # EMA shadow on the card, no host copy per update
blocks_to_swap = 0             # 20: 2.1 GB off the peak, same s/step
activation_memory_budget = 0.3     # 0.1: 2 GB off the peak, 2-4 % slower; 0.4 can OOM on 16 GB
swap_h2d_only = true           # only with blocks_to_swap > 0
compile = true
expandable_segments = true
grad_checkpointing = false

# Reference latents (a cache with *.moss_ref files; i2i probe). Stamped in the LoRA.
ref_timestep = 0.0             # reference tokens' modulation timestep; < 0 = the image's
ref_isolate = false            # reference tokens attend only to themselves

# Relational REPA (parked: no gain over channel scaling, 2026-10-20).
repa_weight = 0.0              # 0 = off
# repa_layer = 11
# repa_pe_root = "post_image_dataset/lora"

