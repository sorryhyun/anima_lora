output_name = "anima_turbo_v3_longer"
dit_path = "models/diffusion_models/anima-base-v1.0.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"

iterations = 10000
batch_size = 1
seed = 42
use_masked_loss = false  # v2: masks are opt-in (`make mask` + this key)

channel_scaling_alpha = 0.0
compile_dynamic_seq = true
activation_memory_budget = 0.99

base_loss = "dpdmd"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"

train_adaln = true
adaln_rank = 16
adaln_alpha = 90
fake_tau_banks = 1
fake_tau_boundary = 0.5

per_step_expert = false

student_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"
fake_init_weights = "models/extracted/anima_turbo_v1.1_delta_r96_asvd_adaln.safetensors"

[dmd]
student_steps = 4
teacher_cfg = 4
dynamic_schedule = true
dm_x0_norm = true
norm_floor = 0.05
grad_step = "random"

[cdm]
weight = 1.0

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 200
weight_decay = 0.0
grad_clip = 1.0

[dpdmd]
k_anchor = 6
teacher_anchor_steps = 12
div_weight = 0.1
detach_after_first = true

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[gan]
weight_gen = 0.03
feature_block_idx = -1
disc_lr = 1e-5
disc_hidden = 0
disc_head = "token"
delay_steps = 0
warmup_steps = 0
r1_weight = 0.0
r1_alpha = 0.1
use_same_t_noise = true
grad_ckpt = true

[f_distill]
f_div = "rkl"
ratio_lower = 0.1
ratio_upper = 20.0
ratio_ema_rate = 0.0
bin_num = 10
ratio_normalization = true

[softrank]
weight = 0.0
k = 2
every_n = 4
softness = 0.1
pool_size = 2
warmup_ratio = 1.0

[io]
save_every = 1000
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 1000
