# The base DP-DMD loop: step 0 regresses on the teacher anchor, steps 1..N-1 take the DMD gradient
# against a LoRA fake, on the static 4-step grid at shift 3 (sigma 1 -> 0.9 -> 0.75 -> 0.5 -> 0).
# The anchor is 7 of 28 teacher steps, which ends on sigma 0.9, the student's first boundary.
# The 4-step recipe on top of this loop is open: project/anima_turbo/plan.md. The research runs use
# a local merged soup as the teacher; point dit_path / dit_nonquant_path at yours. The EMA ships.
output_name = "anima_turbo"
dit_path = "models/diffusion_models/anima-base-v1.0_int8_gptq.safetensors"
dit_nonquant_path = "models/diffusion_models/anima-base-v1.0.safetensors"
data_dir = "post_image_dataset/lora"
output_dir = "output/ckpt"

iterations = 1000
batch_size = 1
seed = 42
channel_scaling_alpha = 0.0
compile_dynamic_seq = true
dynamo_recompile_limit = 64
activation_memory_budget = 0.99
int8 = "stream"
stream = "fp32"

[network]
student_rank = 64
student_alpha = 180
fake_rank = 64
fake_alpha = 180
attn_mode = "flash"
student_down_init = "weight_svd"
fake_down_init = "weight_svd"
student_init_weights = ""
fake_init_weights = ""
train_adaln = true
fake_adaln = true
adaln_rank = 16
adaln_alpha = 90

[dmd]
student_steps = 4
teacher_cfg = 4
dm_x0_norm = true
norm_floor = 0.05

[optim]
student_lr = 5e-5
fake_lr = 5e-5
fake_steps_per_student_step = 4
fake_warmup_steps = 200
grad_accum = 1
weight_decay = 0.0
grad_clip = 1.0
lr_schedule = "cosine"

[ema]
window = 0.2

[dpdmd]
k_anchor = 7
teacher_anchor_steps = 28
div_weight = 0.1
anchor_only = false
anchor_cache = ""

[sampling]
t_distribution = "uniform"
sigmoid_scale = 1.0
flow_shift = 3.0

[io]
save_every = 250
log_interval = 5
log_dir = "output/logs/turbo"
validate_every_n_steps = 250
val_diversity_seeds = 8
val_prompt_idx = -1
