network_alpha = 128
network_dim = 32

learning_rate = 2e-5
max_train_epochs = 8
save_every_n_epochs = 8
checkpointing_epochs = 8

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

output_name = "anima_lora"
# lora_down init: "kaiming" | "weight_svd" (W0's top-r right singular vectors,
# the default) | "grad_svd" (sketch THIS run's task gradient before the adapter
# exists — costs one frozen-DiT backward pass per image, blocks_to_swap must be
# 0) | "basis_file" (read a precomputed gradient basis; needs
# network_args grad_basis_file=<path>). The gradient modes are seeded from where
# the task pushes rather than where W is big; output is an ordinary LoRA either
# way. docs/proposal/grad_basis_init.md, networks/grad_basis.py.
down_init = "weight_svd"
path_pattern = "*"

use_timestep_mask = true
min_rank = 1
alpha_rank_scale = 1.0

use_repa       = true
repa_mode      = "relational"
repa_weight    = 0.05
repa_layer     = 8
repa_encoder   = "pe_spatial"
