network_alpha = 128
network_dim = 32

learning_rate = 5e-5
# Effective batch 2, constant lr after the base.toml warmup (5 %), adapter EMA 0.1
# (the --ema_window default), and a clip at 2x the median of the last 50 micro-batch
# norms, applied per micro-batch: spikes are bounded to their share without leaving
# the set. Beat the 2e-5 cosine bs1 clip-1.0 recipe in a blind A/B over 4 seeds x 2
# artists, 41-16, cluster p 0.0078 (docs/anima/findings/lora_gradient_noise_recipe.md).
# The median is kept per σ band: edge-σ norms run ~2x mid-σ ones, so one window reads
# normal edge draws as spikes. Beat the single window blind at matched ||dW||, 39-21,
# cluster p 0.047 (docs/anima/findings/lora_gradient_noise_recipe.md).
lr_scheduler = "constant_with_warmup"
gradient_accumulation_steps = 2
clip_mode = "median"
clip_k = 2.0
clip_per_micro = true
clip_sigma_bands = "0.2,0.4,0.6,0.8"
max_train_epochs = 8
save_every_n_epochs = 8
checkpointing_epochs = 8

use_shuffled_caption_variants = true
cache_llm_adapter_outputs = true
caption_dropout_rate = 0.1

output_name = "anima_lora"
# lora_down init: "kaiming" | "weight_svd" (W0's top-r right singular vectors,
# the default) | "grad_svd" (sketch THIS run's task gradient before the adapter
# exists — costs one frozen-DiT backward pass per image, blocks_to_swap must be
# 0) | "basis_file" (read a precomputed gradient basis; needs
# network_args grad_basis_file=<path>). The gradient modes are seeded from where
# the task pushes rather than where W is big; output is an ordinary LoRA either
# way. docs/anima/methods/svd-down-lora.md, networks/grad_basis.py.
down_init = "weight_svd"
# weight_svd window: slice k seeds lora_down from W0's right singular vectors
# [k*r, (k+1)*r) instead of the top-r. Slices are mutually orthogonal, so
# adapters trained with different slices own disjoint input subspaces — give
# each artist its own k (0, 1, 2, …) when the LoRAs are meant to be merged.
# 0 = top-r (the shipped default). Cap: (k+1)*r must fit every targeted
# layer — the 256-row adaln .1 Linears allow k <= 7 at r=32 (8 artists).
# Stamped as ss_svd_slice in the adapter. adaln_up_* modules ignore the slice
# and always take the top-r (their σ-only input lives in W0's top ~2 directions).
svd_slice = 0
# > 0: interleaved slices — slice k takes vectors {k, k+N, k+2N, …} so every
# artist owns one of the top-N directions. Set it to the shard count (8 for
# k = 0..7); needs N*r <= min(W.shape). 0 = contiguous windows.
svd_slice_count = 0
path_pattern = "*"

# T-LoRA rank mask, off by default since 2026-11-05: it masks in training only, while
# inference runs every rank at every σ, so the shipped file trained one model and
# rendered another. Masked training + masked inference (--lora_timestep_mask, the
# published method) tied this file without the mask, 11-13 (s31, sweetonedollar,
# docs/anima/findings/lora_gradient_noise_recipe.md).
# use_timestep_mask = true
# min_rank = 1
# alpha_rank_scale = 1.0

use_repa       = true
repa_mode      = "relational"
repa_weight    = 0.05
repa_layer     = 8
repa_encoder   = "pe_spatial"
